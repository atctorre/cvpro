<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Crear mi CV | CVPro</title>
<meta name="description" content="Crea tu CV profesional con IA en minutos. Solo responde 21 preguntas y descarga tu CV listo para conseguir entrevistas.">
<meta property="og:title" content="Crear CV con IA | CVPro">
<meta property="og:description" content="21 preguntas guiadas. IA corrige y mejora tu CV. 10 plantillas profesionales. Descarga en PDF.">
<meta property="og:image" content="https://atctorre.github.io/cvpro/og-image.png">
<meta name="robots" content="noindex">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--black:#0a0a0a;--yellow:#FFD000;--white:#fff;--gray:#1a1a1a;--gl:#888;--green:#00C853}
html,body{height:100%;overflow:hidden}
body{font-family:'Inter',sans-serif;background:var(--black);color:var(--white);display:flex;flex-direction:column}

nav{display:flex;align-items:center;justify-content:space-between;padding:14px 5%;background:rgba(10,10,10,0.97);border-bottom:1px solid #1f1f1f;flex-shrink:0}
.nav-logo{font-family:'Syne',sans-serif;font-size:1.2rem;font-weight:800;color:var(--yellow);text-decoration:none}
.nav-logo span{color:var(--white)}
.nav-info{display:flex;align-items:center;gap:14px}
.nav-step{font-size:0.75rem;color:var(--gl)}
.nav-step strong{color:var(--yellow);font-size:0.9rem}
.nav-reset{font-size:0.72rem;color:#555;cursor:pointer;text-decoration:underline}
.nav-reset:hover{color:var(--gl)}

.progress-bar-chat{height:3px;background:#1a1a1a;flex-shrink:0;position:relative}
.progress-fill-chat{height:100%;background:linear-gradient(90deg,var(--yellow),#ff9900);transition:width 0.6s ease;width:0%}

.chat-wrap{flex:1;display:flex;flex-direction:column;max-width:720px;width:100%;margin:0 auto;padding:0 16px;overflow:hidden}
.chat-messages{flex:1;overflow-y:auto;padding:20px 0 8px;display:flex;flex-direction:column;gap:14px}
.chat-messages::-webkit-scrollbar{width:3px}
.chat-messages::-webkit-scrollbar-thumb{background:#2a2a2a;border-radius:4px}

/* MENSAJES */
.msg{display:flex;gap:10px;animation:slideUp 0.35s ease both}
@keyframes slideUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.msg.ai{align-items:flex-start}
.msg.user{align-items:flex-start;flex-direction:row-reverse}
.ai-avatar{width:34px;height:34px;border-radius:50%;background:var(--yellow);display:flex;align-items:center;justify-content:center;font-size:0.95rem;flex-shrink:0;margin-top:2px;font-weight:800;color:#000}
.msg-bubble{max-width:82%;padding:13px 17px;border-radius:18px;font-size:0.88rem;line-height:1.65}
.msg.ai .msg-bubble{background:#161616;border:1px solid #252525;border-top-left-radius:4px;color:#e8e8e8}
.msg.user .msg-bubble{background:var(--yellow);color:#000;border-top-right-radius:4px;font-weight:600}
.msg-meta{font-size:0.68rem;color:#555;margin-top:4px;padding:0 4px}

/* TYPING */
.typing-wrap{display:flex;gap:10px;align-items:flex-start}
.typing{display:flex;gap:5px;padding:13px 17px;background:#161616;border:1px solid #252525;border-radius:18px;border-top-left-radius:4px;width:fit-content}
.typing span{width:6px;height:6px;border-radius:50%;background:#444;animation:bounce 1.2s infinite}
.typing span:nth-child(2){animation-delay:0.2s}
.typing span:nth-child(3){animation-delay:0.4s}
@keyframes bounce{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-7px)}}

/* QUICK OPTS */
.quick-opts{display:flex;flex-wrap:wrap;gap:7px;margin-top:8px;max-width:82%}
.qopt{background:transparent;border:1px solid #2a2a2a;color:#ccc;font-size:0.78rem;padding:6px 13px;border-radius:50px;cursor:pointer;transition:all 0.2s;font-family:'Inter',sans-serif}
.qopt:hover{border-color:var(--yellow);color:var(--yellow);background:rgba(255,208,0,0.05)}

/* STEP INDICATOR */
.step-badge{display:inline-flex;align-items:center;gap:5px;background:#1a1a1a;border:1px solid #2a2a2a;border-radius:50px;padding:4px 10px;font-size:0.68rem;color:#555;margin-bottom:6px}
.step-badge span{color:var(--yellow);font-weight:700}

/* INPUT */
.chat-input-wrap{padding:12px 0 20px;flex-shrink:0}
.input-hint{font-size:0.72rem;color:#444;margin-bottom:7px;padding-left:4px;min-height:16px;transition:color 0.2s}
.chat-input-box{display:flex;gap:8px;background:#161616;border:1.5px solid #252525;border-radius:50px;padding:7px 7px 7px 18px;transition:border-color 0.2s}
.chat-input-box:focus-within{border-color:var(--yellow)}
.chat-input{flex:1;background:transparent;border:none;color:var(--white);font-family:'Inter',sans-serif;font-size:0.9rem;outline:none;padding:6px 0;resize:none;height:34px;overflow:hidden}
.chat-input::placeholder{color:#3a3a3a}
.chat-send{width:38px;height:38px;border-radius:50%;background:var(--yellow);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:transform 0.2s,opacity 0.2s}
.chat-send:hover:not(:disabled){transform:scale(1.08)}
.chat-send:disabled{opacity:0.35;cursor:not-allowed}
.chat-send svg{width:16px;height:16px}

/* ── CHIPS ── */
.chips-wrap{margin-top:8px;max-width:82%}
.chips-titulo{font-size:0.68rem;font-weight:700;color:#666;letter-spacing:0.5px;text-transform:uppercase;margin-bottom:8px}
.chips-grid{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:10px}
.chip{background:#161616;border:1.5px solid #2a2a2a;color:#aaa;font-size:0.78rem;padding:7px 13px;border-radius:50px;cursor:pointer;transition:all 0.18s;font-family:'Inter',sans-serif;user-select:none}
.chip:hover{border-color:rgba(255,208,0,0.4);color:#ddd}
.chip.selected{background:rgba(255,208,0,0.1);border-color:var(--yellow);color:var(--yellow);font-weight:600}
.chips-confirm{display:flex;gap:8px;margin-top:8px;align-items:center}
.btn-chips-ok{background:var(--yellow);color:#000;font-weight:700;font-size:0.8rem;padding:9px 20px;border-radius:50px;border:none;cursor:pointer;font-family:'Inter',sans-serif;transition:transform 0.2s}
.btn-chips-ok:hover{transform:scale(1.03)}
.chips-count{font-size:0.72rem;color:#555}
.tiempo-wrap{display:flex;align-items:center;gap:8px;font-size:0.72rem;color:var(--gl)}
.tiempo-wrap span{color:var(--yellow);font-weight:600}

/* EDITAR RESPUESTA */
.msg-edit-btn{background:none;border:none;color:#333;font-size:0.65rem;cursor:pointer;padding:3px 7px;border-radius:4px;transition:all 0.2s;margin-top:4px;font-family:'Inter',sans-serif}
.msg-edit-btn:hover{color:var(--yellow);background:rgba(255,208,0,0.08)}
.edit-bubble{background:#1a1000;border:1px solid rgba(255,208,0,0.2)!important}

/* AYUDA CONTEXTUAL */
.ctx-help{background:#111;border:1px solid #1e1e1e;border-radius:12px;padding:12px 14px;margin-top:6px;max-width:82%}
.ctx-help-title{font-size:0.65rem;font-weight:700;color:#555;letter-spacing:1px;text-transform:uppercase;margin-bottom:7px}
.ctx-example{font-size:0.75rem;color:#888;line-height:1.5;padding:6px 10px;background:#0d0d0d;border-radius:6px;border-left:2px solid rgba(255,208,0,0.2);margin-bottom:4px}
.ctx-example:last-child{margin-bottom:0}
.ctx-example strong{color:#aaa}

.rev-section{margin-bottom:12px}

@media(max-width:768px){
  nav{padding:10px 4%}
  .nav-step{font-size:0.68rem}
  .nav-reset{font-size:0.68rem}
  .tiempo-wrap{display:none}
  .chat-wrap{padding:0 10px}
  .msg-bubble{max-width:90%;font-size:0.84rem;padding:11px 14px}
  .chat-input-box{padding:6px 6px 6px 14px}
  .chat-input{font-size:0.85rem}
  .quick-opts{gap:6px}
  .qopt{font-size:0.74rem;padding:5px 10px}
  .ctx-help{max-width:95%}
  .ctx-example{font-size:0.72rem}
  .onb-body{padding:24px 20px 18px}
  .onb-title{font-size:1.3rem}
  .rev-section{margin-bottom:10px}
  .rev-input{font-size:0.8rem;padding:8px 10px}
  .btn-rev-ok{font-size:0.84rem;padding:12px}
  .result-card{padding:16px}
  .cv-preview{font-size:0.72rem;max-height:180px}
  .btn-action{font-size:0.78rem;padding:10px}
}
@media(max-width:480px){
  .msg-bubble{max-width:95%;font-size:0.82rem}
  .ai-avatar{width:28px;height:28px;font-size:0.75rem}
  .onb-title{font-size:1.15rem}
}
.rev-label{font-size:0.7rem;font-weight:600;color:#888;letter-spacing:0.5px;text-transform:uppercase;margin-bottom:4px}
.rev-input{width:100%;background:#0d0d0d;border:1px solid #2a2a2a;color:#fff;font-family:'Inter',sans-serif;font-size:0.82rem;padding:9px 12px;border-radius:8px;outline:none;transition:border-color 0.2s}
.rev-input:focus{border-color:var(--yellow)}
.rev-textarea{min-height:70px;resize:vertical;line-height:1.5}
.rev-actions{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}
.btn-rev-ok{flex:2;background:var(--yellow);color:#000;font-weight:800;font-size:0.88rem;padding:13px;border-radius:50px;border:none;cursor:pointer;font-family:'Inter',sans-serif;transition:transform 0.2s}
.btn-rev-ok:hover:not(:disabled){transform:scale(1.02)}
.btn-rev-ok:disabled{opacity:0.5;cursor:not-allowed}
.btn-rev-skip{flex:1;background:transparent;color:#666;font-size:0.8rem;padding:13px;border-radius:50px;border:1px solid #2a2a2a;cursor:pointer;font-family:'Inter',sans-serif}
.btn-rev-skip:hover:not(:disabled){border-color:#444;color:#888}
.btn-rev-skip:disabled{opacity:0.5;cursor:not-allowed}
@keyframes spin{to{transform:rotate(360deg)}}
.result-card{background:#111;border:1px solid #222;border-radius:18px;padding:20px;width:100%}
.result-card h3{font-family:'Syne',sans-serif;font-size:1rem;font-weight:800;color:var(--green);margin-bottom:12px;display:flex;align-items:center;gap:7px}
.cv-preview-wrap{position:relative;border-radius:10px;overflow:hidden}
.cv-preview{background:#0d0d0d;border:1px solid #1f1f1f;border-radius:10px;padding:16px;font-size:0.75rem;line-height:1.7;color:#ccc;white-space:pre-wrap;max-height:240px;overflow-y:auto;font-family:'Courier New',monospace}
.cv-preview.blurred{filter:blur(5px);user-select:none;pointer-events:none}
.unlock-overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(0,0,0,0.65);backdrop-filter:blur(2px);text-align:center;padding:20px;border-radius:10px}
.unlock-overlay h4{font-family:'Syne',sans-serif;color:var(--yellow);font-size:1rem;margin-bottom:6px}
.unlock-overlay p{color:#aaa;font-size:0.78rem;margin-bottom:14px;line-height:1.5}
.btn-unlock{background:var(--yellow);color:#000;font-weight:800;padding:12px 28px;border:none;border-radius:50px;cursor:pointer;font-size:0.9rem;font-family:'Inter',sans-serif;transition:transform 0.2s}
.btn-unlock:hover{transform:scale(1.04)}
.result-actions{display:none;gap:9px;margin-top:13px;flex-wrap:wrap}
.result-actions.visible{display:flex}
.btn-action{flex:1;font-weight:700;font-size:0.82rem;padding:11px;border-radius:50px;border:none;cursor:pointer;min-width:110px;font-family:'Inter',sans-serif;transition:transform 0.2s}
.btn-action:hover{transform:scale(1.03)}
.btn-copy{background:var(--yellow);color:#000}
.btn-plantilla{background:#1e1e1e;color:var(--white);border:1px solid #333}
.btn-plantilla:hover{border-color:var(--yellow);color:var(--yellow)}
.btn-nuevo{background:transparent;color:#666;border:1px solid #222;font-size:0.75rem}

/* ── SELECTOR IDIOMA ── */
.lang-selector{position:fixed;inset:0;z-index:2000;background:var(--black);display:flex;align-items:center;justify-content:center;padding:20px;animation:obFadeIn 0.4s ease}
.lang-card{background:#111;border:1px solid #1e1e1e;border-radius:24px;padding:40px 32px;max-width:420px;width:100%;text-align:center}
.lang-logo{font-family:'Syne',sans-serif;font-size:2rem;font-weight:900;color:var(--yellow);margin-bottom:24px}
.lang-logo span{color:var(--white)}
.lang-question{font-size:1rem;font-weight:600;color:var(--white);line-height:1.6;margin-bottom:28px}
.lang-question span{font-size:0.82rem;color:var(--gl);font-weight:300}
.lang-options{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.lang-opt{background:#1a1a1a;border:2px solid #2a2a2a;border-radius:16px;padding:24px 16px;cursor:pointer;transition:all 0.2s;display:flex;flex-direction:column;align-items:center;gap:8px;font-family:'Inter',sans-serif;text-decoration:none}
.lang-opt:hover{border-color:var(--yellow);background:#1a1500;transform:translateY(-3px)}
.lang-opt .flag{font-size:3rem;line-height:1}
.lang-opt strong{color:var(--white);font-size:1rem;font-weight:700}
.lang-opt small{color:var(--gl);font-size:0.72rem}
.lang-selector.hide{animation:obFadeIn 0.3s ease reverse;pointer-events:none}
.onb-overlay{position:fixed;inset:0;z-index:1000;background:rgba(0,0,0,0.93);display:flex;align-items:center;justify-content:center;padding:20px;animation:obFadeIn 0.4s ease}
@keyframes obFadeIn{from{opacity:0}to{opacity:1}}
.onb-card{background:#111;border:1px solid #1e1e1e;border-radius:24px;max-width:440px;width:100%;overflow:hidden}
.onb-bar{height:3px;background:#1a1a1a}
.onb-fill{height:100%;background:linear-gradient(90deg,var(--yellow),#ff9900);transition:width 0.5s ease}
.onb-body{padding:32px 28px 24px}
.onb-icon{font-size:2.8rem;display:block;margin-bottom:14px;animation:obBounce 0.7s ease}
@keyframes obBounce{0%,100%{transform:translateY(0)}40%{transform:translateY(-10px)}}
.onb-step-label{font-size:0.65rem;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--yellow);opacity:0.7;margin-bottom:8px}
.onb-title{font-family:'Syne',sans-serif;font-size:1.5rem;font-weight:800;line-height:1.15;margin-bottom:10px;letter-spacing:-0.5px}
.onb-title em{color:var(--yellow);font-style:normal}
.onb-desc{color:#777;font-size:0.84rem;line-height:1.7;font-weight:300;margin-bottom:20px}
.onb-list{display:flex;flex-direction:column;gap:9px;margin-bottom:24px}
.onb-item{display:flex;align-items:center;gap:11px;font-size:0.8rem;color:#bbb}
.onb-item-ic{width:30px;height:30px;border-radius:8px;background:rgba(255,208,0,0.08);border:1px solid rgba(255,208,0,0.12);display:flex;align-items:center;justify-content:center;font-size:0.9rem;flex-shrink:0}
.onb-actions{display:flex;gap:8px;align-items:center}
.btn-onb{flex:1;background:var(--yellow);color:#000;font-weight:800;font-size:0.88rem;padding:13px;border-radius:50px;border:none;cursor:pointer;font-family:'Inter',sans-serif;transition:transform 0.2s}
.btn-onb:hover{transform:scale(1.02)}
.btn-onb-skip{background:transparent;color:#444;font-size:0.75rem;padding:13px 12px;border:none;cursor:pointer;font-family:'Inter',sans-serif;white-space:nowrap;transition:color 0.2s}
.btn-onb-skip:hover{color:#666}
.onb-dots{display:flex;gap:5px;justify-content:center;padding:0 28px 20px}
.onb-dot{width:6px;height:6px;border-radius:50%;background:#222;transition:all 0.3s}
.onb-dot.act{background:var(--yellow);width:18px;border-radius:3px}
</style>
</head>
<body>

<!-- SELECTOR DE IDIOMA -->
<div class="lang-selector" id="langSelector">
  <div class="lang-card">
    <div class="lang-logo">CV<span>Pro</span></div>
    <p class="lang-question">¿En qué idioma quieres tu CV?<br><span>What language do you want your CV in?</span></p>
    <div class="lang-options">
      <a class="lang-opt" href="chat-cv.html?lang=es">
        <span class="flag">🇪🇸</span>
        <strong>Español</strong>
        <small>CV en español</small>
      </a>
      <a class="lang-opt" href="chat-cv.html?lang=en">
        <span class="flag">🇺🇸</span>
        <strong>English</strong>
        <small>CV in English</small>
      </a>
    </div>
  </div>
</div>
<div class="onb-overlay" id="onbOverlay" style="display:none">
  <div class="onb-card">
    <div class="onb-bar"><div class="onb-fill" id="onbFill"></div></div>
    <div class="onb-body" id="onbBody"></div>
    <div class="onb-dots" id="onbDots"></div>
  </div>
</div>

<nav>
  <a href="cv299-landing.html" class="nav-logo">CV<span>Pro</span></a>
  <div class="nav-info">
    <div class="tiempo-wrap">⏱ ~<span id="tiempoRestante">10</span> min</div>
    <span class="nav-step">Pregunta <strong id="stepNum">1</strong> de 20</span>
    <span class="nav-reset" onclick="reiniciar()">Reiniciar</span>
  </div>
</nav>
<div class="progress-bar-chat"><div class="progress-fill-chat" id="progressFill"></div></div>

<div class="chat-wrap">
  <div class="chat-messages" id="chatMessages"></div>
  <div class="chat-input-wrap">
    <div class="input-hint" id="inputHint"></div>
    <div class="chat-input-box">
      <textarea class="chat-input" id="chatInput" placeholder="Escribe tu respuesta..." rows="1"
        onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();enviar()}"
        oninput="autoResize(this)"></textarea>
      <button class="chat-send" id="sendBtn" onclick="enviar()">
        <svg viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/>
        </svg>
      </button>
    </div>
  </div>
</div>

<script>
const SUPABASE_URL = 'https://lljmqyejwkgcbuwkgjkh.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imxsam1xeWVqd2tnY2J1d2tnamtoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcxNzc5MzEsImV4cCI6MjEwMjc1MzkzMX0.5zyP9cb9wnkjlPeafe8zBOBPU-joameF0UzxUXDgq60';

let datos = {};
let paso = 0;
let cvGenerado = '';
let historial = [];
let enviando = false;

// ── 16 PREGUNTAS GUIADAS ──
const PASOS = [
  {
    key: 'nombre',
    preg: () => `¡Hola! Soy tu asistente personal de CVPro 👋\n\nEn los próximos minutos voy a hacerte 20 preguntas para crear tu CV profesional. Cuanta más información me des, mejor quedará.\n\nEmpecemos — ¿Cuál es tu nombre completo?`,
    hint: 'Escribe tu nombre y apellidos',
    placeholder: 'Ej: Adolfo Miguel Alvarez Reyes'
  },
  {
    key: 'puesto',
    preg: (d) => `Perfecto, ${d.nombre.split(' ')[0]} 👍\n\n¿A qué puesto de trabajo estás aplicando actualmente?`,
    hint: 'Sé específico — eso mejora el CV',
    placeholder: 'Ej: Piloto de Helicóptero, Contador Senior, Desarrollador React...',
    opts: ['Piloto de Aviación','Desarrollador Web','Contador','Vendedor','Enfermero/a','Ingeniero','Administrador','Docente','Diseñador Gráfico','Otro']
  },
  {
    key: 'pais',
    preg: () => `¿De qué país eres y en qué país estás buscando trabajo?`,
    hint: 'Si es diferente, menciona ambos',
    placeholder: 'Ej: El Salvador / también aplico en Guatemala',
    opts: ['El Salvador','México','Colombia','Chile','Argentina','Perú','Costa Rica','Guatemala','Honduras','Panamá','Ecuador','Otro']
  },
  {
    key: 'email_tel',
    preg: () => `¿Cuál es tu email y teléfono profesional?\n\nEstos aparecerán en tu CV para que los empleadores te contacten.`,
    hint: 'Email y teléfono separados por coma o espacio',
    placeholder: 'Ej: adolfo@gmail.com, +503 7777-7777'
  },
  {
    key: 'linkedin',
    preg: () => `¿Tienes perfil de LinkedIn o alguna página web/portafolio?\n\nSi no tienes, escribe "no tengo" y seguimos 😊`,
    hint: 'Opcional pero recomendado para profesionales',
    placeholder: 'Ej: linkedin.com/in/adolfo-alvarez o "no tengo"'
  },
  {
    key: 'resumen_personal',
    preg: (d) => `Ahora cuéntame sobre ti, ${d.nombre.split(' ')[0]} 😊\n\n¿Cuántos años de experiencia tienes y qué te hace especial como profesional?`,
    hint: 'Selecciona lo que aplique o escribe tu propia descripción',
    placeholder: 'O escribe con tus palabras: "Tengo X años de experiencia en..."',
    chips: {
      titulo: '⚡ Selecciona los que apliquen (puedes elegir varios)',
      multi: true,
      opciones: [
        '1-2 años de experiencia','3-5 años de experiencia','6-10 años de experiencia','Más de 10 años de experiencia',
        'Trabajo bajo presión','Lideré equipos','Trabajo independiente','Experiencia internacional',
        'Recién graduado','Cambio de carrera','Experiencia militar','Trabajo con clientes'
      ]
    }
  },

function playSound(type) {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain); gain.connect(ctx.destination);
    if (type === 'receive') {
      osc.frequency.setValueAtTime(900, ctx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(650, ctx.currentTime + 0.12);
      gain.gain.setValueAtTime(0.07, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.18);
    } else {
      osc.frequency.setValueAtTime(450, ctx.currentTime);
      gain.gain.setValueAtTime(0.04, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.08);
    }
    osc.start(ctx.currentTime); osc.stop(ctx.currentTime + 0.2);
  } catch(e) {}
}

let modoEdicion = null;

function editarRespuesta(pasoIdx) {
  const p = PASOS[pasoIdx];
  if (!p) return;
  modoEdicion = pasoIdx;
  const val = datos[p.key] || '';
  const input = document.getElementById('chatInput');
  input.value = val;
  input.focus();
  autoResize(input);
  const hint = document.getElementById('inputHint');
  hint.textContent = `✏️ Editando pregunta ${pasoIdx + 1} — presiona Enter para guardar`;
  hint.style.color = 'var(--yellow)';
  window.scrollTo({top:document.body.scrollHeight, behavior:'smooth'});

function cancelarEdicion() {
  modoEdicion = null;
  document.getElementById('chatInput').value = '';
  document.getElementById('inputHint').textContent = '';
  document.getElementById('inputHint').style.color = '';
}
function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 120) + 'px';
}

function guardarEstado() {
  localStorage.setItem('cvpro_chat16', JSON.stringify({datos, paso, historial}));
}

function reiniciar() {
  if (!confirm('¿Seguro que quieres reiniciar? Perderás el progreso actual.')) return;
  localStorage.removeItem('cvpro_chat16');
  localStorage.removeItem('cvpro_onboarding_visto');
  location.reload();
}

// ── SELECTOR DE IDIOMA ──
function elegirIdiomaCV(langElegido) {
  datos.idioma_cv = langElegido === 'en' ? 'Solo en inglés 🇺🇸' : 'Solo en español 🇪🇸';
  localStorage.setItem('cvpro_lang_cv', langElegido);

  // Ocultar selector inmediatamente
  document.getElementById('langSelector').style.display = 'none';

  // Mostrar onboarding si es primera vez
  if (!localStorage.getItem('cvpro_onboarding_visto')) {
    mostrarOnboarding();
  }

  // Arrancar chat
  arrancarChat();
}

async function arrancarChat() {
  await mostrarTyping(600);
  const p = PASOS[0];
  renderMsgAI(typeof p.preg === 'function' ? p.preg(datos) : p.preg, p.opts||[], true, 0, p.chips||null);
  setHint(p.hint||'');
  document.getElementById('chatInput').placeholder = p.placeholder||'Escribe aquí...';
  actualizarUI();
}

// Verificar si viene con idioma de la landing
function verificarIdiomaInicial() {
  // Leer de URL params primero
  const urlParams = new URLSearchParams(window.location.search);
  const langParam = urlParams.get('lang');

  // Leer de localStorage
  const langStored = localStorage.getItem('cvpro_lang_cv') || localStorage.getItem('cvpro_lang');

  const langFinal = langParam || langStored;

  if (langFinal) {
    datos.idioma_cv = langFinal === 'en' ? 'Solo en inglés 🇺🇸' : 'Solo en español 🇪🇸';
    localStorage.setItem('cvpro_lang_cv', langFinal);
    document.getElementById('langSelector').style.display = 'none';
    return true; // Ya tiene idioma
  }
  return false; // Mostrar selector
}

async function init() {
  const saved = localStorage.getItem('cvpro_chat16');

  if (saved) {
    document.getElementById('langSelector').style.display = 'none';
    try {
      const s = JSON.parse(saved);
      datos = s.datos || {};
      paso = s.paso || 0;
      historial = s.historial || [];
      if (historial.length > 0) {
        historial.forEach(m => renderMsg(m.tipo, m.texto, m.opts||[], false));
        actualizarUI();
        if (paso >= PASOS.length) mostrarGenerando();
        return;
      }
    } catch(e) {}
  }

  // Inicio fresco — solo corre si ya hay idioma elegido
  if (!datos.idioma_cv) return;

  await mostrarTyping(600);
  const p = PASOS[0];
  renderMsgAI(typeof p.preg === 'function' ? p.preg(datos) : p.preg, p.opts||[], true, 0, p.chips||null);
  setHint(p.hint||'');
  document.getElementById('chatInput').placeholder = p.placeholder||'Escribe aquí...';
  actualizarUI();
}

// ── RENDER ──
function renderMsg(tipo, texto, opts=[], animar=true, pasoIdx=null, chips=null) {
  const msgs = document.getElementById('chatMessages');
  const div = document.createElement('div');
  div.className = `msg ${tipo}`;
  if (!animar) div.style.animation = 'none';

  if (tipo === 'ai') {
    let optsHtml = opts.length ? `<div class="quick-opts">${opts.map(o=>`<button class="qopt" onclick="selOpt(this.textContent)">${o}</button>`).join('')}</div>` : '';
    let chipsHtml = '';
    if (chips) {
      const chipsId = 'chips_' + Date.now();
      chipsHtml = `<div class="chips-wrap" id="${chipsId}">
        <div class="chips-titulo">${chips.titulo}</div>
        <div class="chips-grid">${chips.opciones.map(o=>`<div class="chip" onclick="toggleChip(this,'${chipsId}',${chips.multi})">${o}</div>`).join('')}</div>
        <div class="chips-confirm">
          <button class="btn-chips-ok" onclick="confirmarChips('${chipsId}')">✓ Confirmar selección</button>
          <span class="chips-count" id="${chipsId}_count">0 seleccionados</span>
        </div>
      </div>`;
    }
    const ayudaHtml = (pasoIdx !== null && !chips) ? renderAyuda(PASOS[pasoIdx]?.key) : '';
    div.innerHTML = `<div class="ai-avatar">CV</div><div><div class="msg-bubble">${texto.replace(/\n/g,'<br>')}</div>${optsHtml}${chipsHtml}${ayudaHtml}</div>`;
  } else {
    const editBtn = pasoIdx !== null ? `<div><button class="msg-edit-btn" onclick="editarRespuesta(${pasoIdx})">✏️ editar</button></div>` : '';
    div.innerHTML = `<div><div class="msg-bubble">${texto}</div>${editBtn}</div>`;
    playSound('send');
  }

  msgs.appendChild(div);
  msgs.scrollTop = msgs.scrollHeight;
}

function renderMsgAI(texto, opts=[], animar=true, pasoIdx=null, chips=null) {
  renderMsg('ai', texto, opts, animar, pasoIdx, chips);
  historial.push({tipo:'ai', texto, opts});
  guardarEstado();
  if (animar) playSound('receive');

// ── CHIPS LOGIC ──
function toggleChip(el, wrapId, multi) {
  if (!multi) {
    document.querySelectorAll(`#${wrapId} .chip`).forEach(c => c.classList.remove('selected'));
  }
  el.classList.toggle('selected');
  const count = document.querySelectorAll(`#${wrapId} .chip.selected`).length;
  const countEl = document.getElementById(wrapId + '_count');
  if (countEl) countEl.textContent = count === 0 ? '0 seleccionados' : `${count} seleccionado${count>1?'s':''}`;
}

function confirmarChips(wrapId) {
  const seleccionados = [...document.querySelectorAll(`#${wrapId} .chip.selected`)].map(c => c.textContent);
  const inputEl = document.getElementById('chatInput');
  if (seleccionados.length === 0) {
    inputEl.focus();
    return;
  }
  const textoInput = inputEl.value.trim();
  const textoFinal = textoInput
    ? seleccionados.join(', ') + '. ' + textoInput
    : seleccionados.join(', ');
  inputEl.value = textoFinal;
  enviar();
}

async function mostrarTyping(ms=1000) {
  const msgs = document.getElementById('chatMessages');
  const div = document.createElement('div');
  div.id = 'typing-indicator';
  div.className = 'msg ai';
  div.style.animation = 'none';
  div.innerHTML = `<div class="ai-avatar">CV</div><div class="typing"><span></span><span></span><span></span></div>`;
  msgs.appendChild(div);
  msgs.scrollTop = msgs.scrollHeight;
  await sleep(ms);
  div.remove();
}

function setHint(txt) {
  document.getElementById('inputHint').textContent = txt;
}

function selOpt(val) {
  document.getElementById('chatInput').value = val;
  enviar();
}

// ── ENVIAR ──
async function enviar() {
  if (enviando) return;
  const input = document.getElementById('chatInput');
  const texto = input.value.trim();
  if (!texto) return;

  // MODO EDICIÓN
  if (modoEdicion !== null) {
    const p = PASOS[modoEdicion];
    datos[p.key] = texto;
    guardarEstado();
    cancelarEdicion();
    renderMsgAI(`✅ Respuesta actualizada. Continúa desde donde estabas o sigue respondiendo 👍`);
    return;
  }

  enviando = true;
  input.value = '';
  input.style.height = 'auto';
  document.getElementById('sendBtn').disabled = true;

  const pasoActual = paso;
  renderMsgUser(texto, pasoActual);

  if (paso < PASOS.length) {
    const key = PASOS[paso].key;
    datos[key] = texto;
    paso++;
    actualizarUI();
    guardarEstado();

    const delay = 700 + Math.random() * 500;
    await mostrarTyping(delay);

    const fn = COMENTARIOS[key];
    if (fn) {
      const com = typeof fn === 'function' ? fn(texto) : fn;
      if (com) {
        renderMsgAI(com);
        await mostrarTyping(500 + Math.random()*400);
      }
    }

    if (paso < PASOS.length) {
      const next = PASOS[paso];
      const preg = typeof next.preg === 'function' ? next.preg(datos) : next.preg;
      renderMsgAI(preg, next.opts||[], true, paso, next.chips||null);
      setHint(next.hint||'');
      input.placeholder = next.placeholder||'Escribe aquí...';
    } else {
      await mostrarGenerando();
    }
  }

  enviando = false;
  document.getElementById('sendBtn').disabled = false;
  document.getElementById('chatInput').focus();
}

// ── UI ──
function actualizarUI() {
  const p = Math.min(paso, PASOS.length);
  const pct = Math.round((p / PASOS.length) * 100);
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('stepNum').textContent = Math.min(p + 1, 21);
  actualizarTiempo();
}

// ── GENERAR CV ──

  document.getElementById('chatInput').disabled = true;
  document.getElementById('sendBtn').disabled = true;
  document.getElementById('inputHint').textContent = '';

function detectarSectorCV(puesto, habilidades, tipoEmpresa) {
  const texto = (puesto + ' ' + habilidades + ' ' + tipoEmpresa).toLowerCase();
  let mejor = null, maxScore = 0;
  for (const [id, data] of Object.entries(SECTORES_CV)) {
    const score = data.k.filter(kw => texto.includes(kw.toLowerCase())).length;
    if (score > maxScore) { maxScore = score; mejor = data; }
  }
  return maxScore > 0 ? mejor : null;
}

function construirCVData() {
  const ct = datos.email_tel || '';
  const emailM = ct.match(/[\w.+-]+@[\w.-]+\.\w{2,}/);
  const telM = ct.match(/[\+\d][\d\s\-\(\)\.]{6,}/);
  const email = emailM ? emailM[0] : '';
  const telefono = telM ? telM[0].trim() : '';

  const cv = cvGenerado || '';

  // ── HELPER: extraer sección del CV ──
  function extraerSeccion(patron) {
    const m = cv.match(patron);
    return m ? m[1].trim() : '';
  }

  function limpiarBullet(l) {
    return l.replace(/^[\s•·▸▪\-\*]+/, '').trim();
  }

  function esBullet(l) {
    return /^[\s]*[•·▸▪\-\*]/.test(l) && l.trim().length > 2;
  }

  // ── RESUMEN ──
  let resumen = extraerSeccion(/RESUMEN PROFESIONAL[^\n]*\n[─\-═]+\s*\n([\s\S]*?)(?=\n[A-ZÁÉÍÓÚ\s]{4,}\n[─\-═]+|\n══)/i);
  if (!resumen) resumen = datos.resumen_personal || '';
  resumen = resumen.replace(/\n+/g, ' ').trim();

  // ── EXPERIENCIA ──
  const experiencia = [];
  const expRaw = extraerSeccion(/EXPERIENCIA PROFESIONAL[^\n]*\n[─\-═]+\s*\n([\s\S]*?)(?=\n[A-ZÁÉÍÓÚ\s]{4,}\n[─\-═]+|\n══)/i);

  if (expRaw) {
    // Detectar bloques por separador de cargo (línea sin bullet que tiene | o mayúsculas)
    const lineas = expRaw.split('\n');
    let bloqueActual = null;

    lineas.forEach(linea => {
      const l = linea.trim();
      if (!l) return;

      const esHeader = !esBullet(linea) && (
        l.includes('|') ||
        (l === l.toUpperCase() && l.length > 5) ||
        /^[A-ZÁÉÍÓÚ][a-záéíóúñ\s]+[A-ZÁÉÍÓÚ]/.test(l)
      );

      if (esHeader && !esBullet(linea)) {
        if (bloqueActual && bloqueActual.bullets.length) experiencia.push(bloqueActual);
        const partes = l.split('|').map(s => s.trim());
        bloqueActual = {
          titulo: partes[0] || '',
          empresa: partes[1] || '',
          periodo: partes[2] || '',
          bullets: []
        };
      } else if (bloqueActual && esBullet(linea)) {
        const b = limpiarBullet(l);
        if (b.length > 5) bloqueActual.bullets.push(b);
      } else if (bloqueActual && l.length > 10 && !esBullet(linea)) {
        // Línea de empresa/período sin bullet
        if (!bloqueActual.empresa && l) bloqueActual.empresa = l;
      }
    });
    if (bloqueActual && bloqueActual.bullets.length) experiencia.push(bloqueActual);
  }

  // Fallback inteligente si no se parseó
  if (!experiencia.length) {
    const exp1parts = (datos.exp1 || '').split(/[—|\-]/).map(s => s.trim());
    const bullets1 = (datos.logros1 || '').split('\n').map(l => limpiarBullet(l)).filter(l => l.length > 3);
    experiencia.push({
      titulo: exp1parts[0] || datos.puesto || '',
      empresa: exp1parts[1] || '',
      periodo: exp1parts[2] || '',
      bullets: bullets1.length ? bullets1 : ['Responsabilidades y logros del cargo']
    });
    const exp2valida = datos.exp2 && !datos.exp2.toLowerCase().match(/^no$|solo|ninguno/);
    if (exp2valida) {
      const exp2parts = datos.exp2.split(/[—|\-]/).map(s => s.trim());
      const bullets2 = (datos.logros2 || '').split('\n').map(l => limpiarBullet(l)).filter(l => l.length > 3);
      experiencia.push({
        titulo: exp2parts[0] || '',
        empresa: exp2parts[1] || '',
        periodo: exp2parts[2] || '',
        bullets: bullets2.length ? bullets2 : []
      });
    }
  }

  // ── EDUCACIÓN ──
  const educacion = [];
  const eduRaw = extraerSeccion(/EDUCACIÓN[^\n]*\n[─\-═]+\s*\n([\s\S]*?)(?=\nCERTIFICAC|\nHABILIDADES|\nINFORMACIÓN|\n══)/i);

  if (eduRaw) {
    eduRaw.split('\n').forEach(l => {
      const t = l.trim();
      if (!t || esBullet(l)) return;
      const partes = t.split(/\s*[\|—]\s*/);
      if (partes[0] && partes[0].length > 2) {
        educacion.push({
          titulo: partes[0].trim(),
          institucion: partes[1]?.trim() || '',
          año: partes[2]?.trim() || ''
        });
      }
    });
  }

  if (!educacion.length) {
    (datos.estudios || '').split('\n').filter(Boolean).forEach(l => {
      const partes = l.split(/[\|—]/).map(s => s.trim());
      educacion.push({ titulo: partes[0] || l, institucion: partes[1] || '', año: partes[2] || '' });
    });
  }
  if (!educacion.length) educacion.push({ titulo: datos.estudios || '', institucion: '', año: '' });

  // ── HABILIDADES ──
  let habsTexto = '';
  // Buscar en CV generado
  const habsM = cv.match(/Técnicas?:\s*([^\n]+)/i);
  const habsM2 = cv.match(/HABILIDADES[^\n]*\n[─\-═]+\s*\n[\s\S]*?Técnicas?:\s*([^\n]+)/i);
  if (habsM) habsTexto = habsM[1];
  else if (habsM2) habsTexto = habsM2[1];
  else habsTexto = datos.habilidades_tecnicas || '';

  // También extraer habilidades blandas
  let habsBTexto = '';
  const habsBM = cv.match(/Blandas?:\s*([^\n]+)/i);
  if (habsBM) habsBTexto = habsBM[1];
  else habsBTexto = datos.habilidades_blandas || '';

  const habsTec = habsTexto.split(/[,;\/]/).map((h, i) => ({
    nombre: h.trim().replace(/^[\-•]\s*/, ''),
    nivel: Math.max(65, 92 - i * 6)
  })).filter(h => h.nombre && h.nombre.length > 1).slice(0, 6);

  const habsBlan = habsBTexto.split(/[,;\/]/).map((h, i) => ({
    nombre: h.trim().replace(/^[\-•]\s*/, ''),
    nivel: Math.max(60, 85 - i * 5)
  })).filter(h => h.nombre && h.nombre.length > 1).slice(0, 3);

  const todasHabs = [...habsTec, ...habsBlan].slice(0, 8);

  // ── IDIOMAS ──
  let idiomasTexto = '';
  const idiomasM = cv.match(/Idiomas?:\s*([^\n]+)/i);
  if (idiomasM) idiomasTexto = idiomasM[1];
  else idiomasTexto = datos.idiomas_nivel || 'Español nativo';

  const idiomas = idiomasTexto.split(/[,;]/).map(id => {
    const clean = id.trim().replace(/^[\-•]\s*/, '');
    const partes = clean.split(/\s+/);
    const nombre = partes[0] || '';
    const nivel = partes.slice(1).join(' ') || 'Nativo';
    return { nombre, nivel };
  }).filter(i => i.nombre && i.nombre.length > 1 && !i.nombre.match(/^[\-•]/));

  // ── LOGROS / CERTIFICACIONES ──
  const logros = [];
  const certRaw = extraerSeccion(/CERTIFICACIONES[^\n]*\n[─\-═]+\s*\n([\s\S]*?)(?=\nHABILIDADES|\nINFORMACIÓN|\n══)/i);
  if (certRaw) {
    certRaw.split('\n').forEach(l => {
      const b = limpiarBullet(l);
      if (b.length > 3) logros.push(b);
    });
  }

  return {
    nombre: datos.nombre || '',
    email,
    telefono,
    pais: datos.pais || '',
    linkedin: datos.linkedin?.toLowerCase().includes('no') ? '' : (datos.linkedin || ''),
    puesto: datos.puesto || '',
    resumen,
    experiencia,
    educacion,
    habilidades: todasHabs.length ? todasHabs : [{ nombre: 'Por definir', nivel: 70 }],
    idiomas: idiomas.length ? idiomas : [{ nombre: 'Español', nivel: 'Nativo' }],
    logros
  };
}

let onbPaso = 0;

function mostrarOnboarding() {

function renderOnbPaso() {
  const p = ONB_PASOS[onbPaso];
  const total = ONB_PASOS.length;
  const pct = Math.round(((onbPaso+1)/total)*100);

  document.getElementById('onbFill').style.width = pct+'%';

  document.getElementById('onbBody').innerHTML = `
    <div class="onb-step-label">Paso ${onbPaso+1} de ${total}</div>
    <span class="onb-icon">${p.icon}</span>
    <h2 class="onb-title">${p.titulo}</h2>
    <p class="onb-desc">${p.desc}</p>
    <div class="onb-list">
      ${p.lista.map(i=>`<div class="onb-item"><div class="onb-item-ic">${i.ic}</div><span>${i.txt}</span></div>`).join('')}
    </div>
    <div class="onb-actions">
      <button class="btn-onb" onclick="siguienteOnb()">${p.btn}</button>
      ${onbPaso < total-1 ? `<button class="btn-onb-skip" onclick="cerrarOnboarding()">Saltar</button>` : ''}
    </div>`;

  const dots = document.getElementById('onbDots');
  dots.innerHTML = ONB_PASOS.map((_,i)=>`<div class="onb-dot ${i===onbPaso?'act':''}"></div>`).join('');
}

function siguienteOnb() {
  onbPaso++;
  if (onbPaso >= ONB_PASOS.length) {
    cerrarOnboarding();
  } else {
    renderOnbPaso();
  }
}

function cerrarOnboarding() {
  const overlay = document.getElementById('onbOverlay');
  overlay.style.animation = 'obFadeIn 0.3s ease reverse';

}

});
