<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Crear mi CV | CVPro</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--black:#0a0a0a;--yellow:#FFD000;--white:#fff;--gray:#1a1a1a;--gl:#888;--green:#00C853}
html,body{height:100%;overflow:hidden}
body{font-family:'Inter',sans-serif;background:var(--black);color:var(--white);display:flex;flex-direction:column}

nav{display:flex;align-items:center;justify-content:space-between;padding:14px 5%;background:rgba(10,10,10,0.97);border-bottom:1px solid #1f1f1f;flex-shrink:0}
.nav-logo{font-family:'Syne',sans-serif;font-size:1.2rem;font-weight:800;color:var(--yellow);text-decoration:none}
.nav-logo span{color:var(--white)}
.nav-info{display:flex;align-items:center;gap:14px}
.nav-step{font-size:0.75rem;color:var(--gl)}
.nav-step strong{color:var(--yellow);font-size:0.9rem}
.nav-reset{font-size:0.72rem;color:#555;cursor:pointer;text-decoration:underline}
.nav-reset:hover{color:var(--gl)}

.progress-bar-chat{height:3px;background:#1a1a1a;flex-shrink:0;position:relative}
.progress-fill-chat{height:100%;background:linear-gradient(90deg,var(--yellow),#ff9900);transition:width 0.6s ease;width:0%}

.chat-wrap{flex:1;display:flex;flex-direction:column;max-width:720px;width:100%;margin:0 auto;padding:0 16px;overflow:hidden}
.chat-messages{flex:1;overflow-y:auto;padding:20px 0 8px;display:flex;flex-direction:column;gap:14px}
.chat-messages::-webkit-scrollbar{width:3px}
.chat-messages::-webkit-scrollbar-thumb{background:#2a2a2a;border-radius:4px}

/* MENSAJES */
.msg{display:flex;gap:10px;animation:slideUp 0.35s ease both}
@keyframes slideUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.msg.ai{align-items:flex-start}
.msg.user{align-items:flex-start;flex-direction:row-reverse}
.ai-avatar{width:34px;height:34px;border-radius:50%;background:var(--yellow);display:flex;align-items:center;justify-content:center;font-size:0.95rem;flex-shrink:0;margin-top:2px;font-weight:800;color:#000}
.msg-bubble{max-width:82%;padding:13px 17px;border-radius:18px;font-size:0.88rem;line-height:1.65}
.msg.ai .msg-bubble{background:#161616;border:1px solid #252525;border-top-left-radius:4px;color:#e8e8e8}
.msg.user .msg-bubble{background:var(--yellow);color:#000;border-top-right-radius:4px;font-weight:600}
.msg-meta{font-size:0.68rem;color:#555;margin-top:4px;padding:0 4px}

/* TYPING */
.typing-wrap{display:flex;gap:10px;align-items:flex-start}
.typing{display:flex;gap:5px;padding:13px 17px;background:#161616;border:1px solid #252525;border-radius:18px;border-top-left-radius:4px;width:fit-content}
.typing span{width:6px;height:6px;border-radius:50%;background:#444;animation:bounce 1.2s infinite}
.typing span:nth-child(2){animation-delay:0.2s}
.typing span:nth-child(3){animation-delay:0.4s}
@keyframes bounce{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-7px)}}

/* QUICK OPTS */
.quick-opts{display:flex;flex-wrap:wrap;gap:7px;margin-top:8px;max-width:82%}
.qopt{background:transparent;border:1px solid #2a2a2a;color:#ccc;font-size:0.78rem;padding:6px 13px;border-radius:50px;cursor:pointer;transition:all 0.2s;font-family:'Inter',sans-serif}
.qopt:hover{border-color:var(--yellow);color:var(--yellow);background:rgba(255,208,0,0.05)}

/* STEP INDICATOR */
.step-badge{display:inline-flex;align-items:center;gap:5px;background:#1a1a1a;border:1px solid #2a2a2a;border-radius:50px;padding:4px 10px;font-size:0.68rem;color:#555;margin-bottom:6px}
.step-badge span{color:var(--yellow);font-weight:700}

/* INPUT */
.chat-input-wrap{padding:12px 0 20px;flex-shrink:0}
.input-hint{font-size:0.72rem;color:#444;margin-bottom:7px;padding-left:4px;min-height:16px;transition:color 0.2s}
.chat-input-box{display:flex;gap:8px;background:#161616;border:1.5px solid #252525;border-radius:50px;padding:7px 7px 7px 18px;transition:border-color 0.2s}
.chat-input-box:focus-within{border-color:var(--yellow)}
.chat-input{flex:1;background:transparent;border:none;color:var(--white);font-family:'Inter',sans-serif;font-size:0.9rem;outline:none;padding:6px 0;resize:none;height:34px;overflow:hidden}
.chat-input::placeholder{color:#3a3a3a}
.chat-send{width:38px;height:38px;border-radius:50%;background:var(--yellow);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:transform 0.2s,opacity 0.2s}
.chat-send:hover:not(:disabled){transform:scale(1.08)}
.chat-send:disabled{opacity:0.35;cursor:not-allowed}
.chat-send svg{width:16px;height:16px}

/* RESULTADO */
.result-card{background:#111;border:1px solid #222;border-radius:18px;padding:20px;width:100%}
.result-card h3{font-family:'Syne',sans-serif;font-size:1rem;font-weight:800;color:var(--green);margin-bottom:12px;display:flex;align-items:center;gap:7px}
.cv-preview-wrap{position:relative;border-radius:10px;overflow:hidden}
.cv-preview{background:#0d0d0d;border:1px solid #1f1f1f;border-radius:10px;padding:16px;font-size:0.75rem;line-height:1.7;color:#ccc;white-space:pre-wrap;max-height:240px;overflow-y:auto;font-family:'Courier New',monospace}
.cv-preview.blurred{filter:blur(5px);user-select:none;pointer-events:none}
.unlock-overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(0,0,0,0.65);backdrop-filter:blur(2px);text-align:center;padding:20px;border-radius:10px}
.unlock-overlay h4{font-family:'Syne',sans-serif;color:var(--yellow);font-size:1rem;margin-bottom:6px}
.unlock-overlay p{color:#aaa;font-size:0.78rem;margin-bottom:14px;line-height:1.5}
.btn-unlock{background:var(--yellow);color:#000;font-weight:800;padding:12px 28px;border:none;border-radius:50px;cursor:pointer;font-size:0.9rem;font-family:'Inter',sans-serif;transition:transform 0.2s}
.btn-unlock:hover{transform:scale(1.04)}
.result-actions{display:none;gap:9px;margin-top:13px;flex-wrap:wrap}
.result-actions.visible{display:flex}
.btn-action{flex:1;font-weight:700;font-size:0.82rem;padding:11px;border-radius:50px;border:none;cursor:pointer;min-width:110px;font-family:'Inter',sans-serif;transition:transform 0.2s}
.btn-action:hover{transform:scale(1.03)}
.btn-copy{background:var(--yellow);color:#000}
.btn-plantilla{background:#1e1e1e;color:var(--white);border:1px solid #333}
.btn-plantilla:hover{border-color:var(--yellow);color:var(--yellow)}
.btn-nuevo{background:transparent;color:#666;border:1px solid #222;font-size:0.75rem}
</style>
</head>
<body>

<nav>
  <a href="cv299-landing.html" class="nav-logo">CV<span>Pro</span></a>
  <div class="nav-info">
    <span class="nav-step">Pregunta <strong id="stepNum">1</strong> de 20</span>
    <span class="nav-reset" onclick="reiniciar()">Reiniciar</span>

        <svg viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/>
        </svg>
      </button>
    </div>
  </div>
</div>

<script>
const SUPABASE_URL = 'https://lljmqyejwkgcbuwkgjkh.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imxsam1xeWVqd2tnY2J1d2tnamtoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcxNzc5MzEsImV4cCI6MjEwMjc1MzkzMX0.5zyP9cb9wnkjlPeafe8zBOBPU-joameF0UzxUXDgq60';

let datos = {};
let paso = 0;

// ── 16 PREGUNTAS GUIADAS ──
const PASOS = [
  {
    key: 'nombre',
    preg: () => `¡Hola! Soy tu asistente personal de CVPro 👋\n\nEn los próximos minutos voy a hacerte 16 preguntas para crear tu CV profesional. Cuanta más información me des, mejor quedará.\n\nEmpecemos — ¿Cuál es tu nombre completo?`,

    opts: ['El Salvador','México','Colombia','Chile','Argentina','Perú','Costa Rica','Guatemala','Honduras','Panamá','Ecuador','Otro']
  },
  {
    key: 'email_tel',
    preg: () => `¿Cuál es tu email y teléfono profesional?\n\nEstos aparecerán en tu CV para que los empleadores te contacten.`,
    hint: 'Email y teléfono separados por coma o espacio',
    placeholder: 'Ej: adolfo@gmail.com, +503 7777-7777'
  },
  {
    key: 'linkedin',
    preg: () => `¿Tienes perfil de LinkedIn o alguna página web/portafolio?\n\nSi no tienes, escribe "no tengo" y seguimos 😊`,
    hint: 'Opcional pero recomendado para profesionales',
    placeholder: 'Ej: linkedin.com/in/adolfo-alvarez o "no tengo"'
  },

    key: 'resumen_personal',
    preg: (d) => `Ahora quiero conocerte mejor, ${d.nombre.split(' ')[0]}.\n\n¿Cómo describirías tu perfil profesional en 2-3 oraciones? Cuéntame qué te hace especial y qué valor aportas a las empresas.\n\n(No te preocupes por la redacción — yo lo mejoro 😊)`,

    key: 'exp1',
    preg: () => `Cuéntame sobre tu experiencia laboral más reciente o actual.\n\n¿En qué empresa trabajaste/trabajas, cuál era tu cargo y cuánto tiempo estuviste?`,
    hint: 'Empresa → Cargo → Período de tiempo',
    placeholder: 'Ej: Fuerza Aérea Salvadoreña — Piloto Aviador — 2018 a 2026'
  },
  {
    key: 'logros1',
    preg: (d) => `Excelente. En ese trabajo de ${d.exp1?.split('—')[0]?.trim() || 'esa empresa'}, ¿cuáles fueron tus principales logros, responsabilidades o proyectos importantes?\n\nSé específico — si tienes números o porcentajes, úsalos. Todo suma.`,

    placeholder: 'Ej: Empresa XYZ — Asistente Administrativo — 2015 a 2018'

    key: 'logros2',
    preg: (d) => {
      if (d.exp2?.toLowerCase().includes('solo') || d.exp2?.toLowerCase().includes('no')) {
        return `Entendido. ¿Hiciste algún trabajo freelance, voluntariado o proyecto personal relevante para tu área?\n\nSi no, escribe "ninguno".`;
      }
      return `¿Qué logros o responsabilidades destacadas tuviste en ${d.exp2?.split('—')[0]?.trim() || 'ese trabajo anterior'}?`;
    },
    hint: 'Logros del trabajo anterior o proyectos freelance',
    placeholder: 'Ej: Gestioné cartera de 50 clientes, reduje costos operativos 20%...',
    multiline: true
  },
  {
    key: 'estudios',
    preg: () => `Cuéntame sobre tu formación académica.\n\n¿Qué estudios tienes? (título, institución y año de graduación)\n\nPuedes incluir varios si aplica.`,
    hint: 'Título → Institución → Año',
    placeholder: 'Ej: Oficial Aviador — Escuela Militar El Salvador — 2018\nBachillerato — Instituto Nacional — 2014',
    multiline: true
  },
  {
    key: 'certificaciones',
    preg: () => `¿Tienes certificaciones, licencias o cursos relevantes para tu puesto?\n\n(Idiomas con certificado, cursos técnicos, licencias profesionales, etc.)\n\nSi no tienes, escribe "ninguno".`,
    hint: 'Certificaciones que validen tus conocimientos',
    placeholder: 'Ej: Licencia Militar Piloto Aviador, Certificación Excel Avanzado, TOEFL 85 puntos...'

    key: 'habilidades_tecnicas',

    placeholder: 'Ej: Liderazgo bajo presión, trabajo en equipo, disciplina militar, toma de decisiones...',
    opts: ['Liderazgo','Trabajo en equipo','Comunicación efectiva','Resolución de problemas','Adaptabilidad','Disciplina y puntualidad','Orientación a resultados','Creatividad e innovación']
  },
  {
    key: 'idiomas_nivel',
    preg: () => `¿Qué idiomas hablas y cuál es tu nivel en cada uno?`,
    hint: 'Idioma + nivel: básico, intermedio, avanzado o nativo',
    placeholder: 'Ej: Español nativo, Inglés intermedio (B2), Portugués básico',
    opts: ['Solo español nativo','Español + inglés básico','Español + inglés intermedio','Español + inglés avanzado','Español + otro idioma']
  },
  {
    key: 'disponibilidad',
    preg: () => `¿Cuándo puedes empezar a trabajar y cuál es tu modalidad preferida?`,
    hint: 'Disponibilidad inmediata o en X semanas/meses',
    placeholder: 'Ej: Disponible inmediatamente, prefiero trabajo presencial...',
    opts: ['Disponible inmediatamente — presencial','Disponible inmediatamente — remoto','Disponible inmediatamente — híbrido','Disponible en 2 semanas','Disponible en 1 mes','Disponible en 3 meses']
  },
  {
    key: 'movilidad',
    preg: () => `¿Estás dispuesto a viajar o reubicarte por trabajo?\n\nEsto es importante para muchos empleadores.`,
    hint: 'Tu flexibilidad geográfica',
    placeholder: 'Ej: Disponible para viajar, sin disponibilidad de reubicación...',
    opts: ['Sí, disponible para viajar y reubicarme','Disponible para viajar pero no reubicarme','Solo trabajo local, sin viajes','Disponible para viajar ocasionalmente']
  },
  {
    key: 'proyectos',
    preg: () => `¿Tienes proyectos personales, publicaciones, portafolio o participación en asociaciones profesionales?\n\nEsto diferencia tu CV del resto. Si no tienes, escribe "ninguno".`,
    hint: 'Proyectos, publicaciones, asociaciones o comunidades',
    placeholder: 'Ej: Blog técnico en Medium, proyectos en GitHub, miembro de la Asociación de Pilotos...'
  },
  {
    key: 'tipo_empresa',
    preg: (d) => `¿Qué tipo de empresa o sector te interesa más para este próximo paso, ${d.nombre.split(' ')[0]}?\n\nEsto me ayuda a enfocar mejor tu CV.`,
    hint: 'Tipo de empresa ideal para ti',
    placeholder: 'Ej: Aerolíneas comerciales, empresa privada mediana, sector gobierno...',
    opts: ['Aerolínea o aviación comercial','Empresa multinacional','Startup o empresa tech','Sector gobierno o público','Empresa familiar o mediana','Consultoría o servicios profesionales','Sector salud','Educación','Cualquier sector']
  },
  {
    key: 'info_extra',
    preg: (d) => `¡Última pregunta, ${d.nombre.split(' ')[0]}! 🎉\n\n¿Hay algo más que quieras incluir en tu CV?\n• Licencia de conducir (tipo)\n• Vehículo propio\n• Referencias disponibles\n• Premios o reconocimientos\n• Trabajo voluntario\n\nSi no tienes nada más, escribe "nada más".`,
    hint: 'Cualquier detalle extra que sume a tu perfil',
    placeholder: 'Ej: Licencia de conducir tipo B, vehículo propio, referencias disponibles...',
    multiline: true
  }
];

// ── COMENTARIOS INTELIGENTES ──
const COMENTARIOS = {
  nombre: null,
  puesto: (v) => `¡${v}! Ese sector tiene muy buena demanda en Latinoamérica 💪 Voy a enfocar tu CV para ese perfil.`,
  pais: (v) => `Perfecto. Adaptaré el lenguaje y formato al mercado laboral de ${v.split('/')[0].trim()} 🌎`,
  email_tel: () => `Anotado. Tu información de contacto quedará bien visible en el CV ✅`,
  linkedin: (v) => v.toLowerCase().includes('no') ? `Sin problema, muchos profesionales no lo tienen aún 👍` : `¡Excelente! Tener LinkedIn aumenta mucho las posibilidades de ser contactado por reclutadores 📊`,

  exp1: (v) => `Entendido. ${v.includes('militar')||v.includes('Militar')||v.includes('Fuerza')||v.includes('fuerza') ? 'La experiencia militar es muy valorada por su disciplina y liderazgo 🎖️' : 'Excelente trayectoria profesional 👍'}`,
  logros1: () => `¡Perfecto! Esos logros van a destacar mucho. La IA va a redactarlos de forma impactante para los reclutadores ⚡`,
  exp2: (v) => v.toLowerCase().includes('solo')||v.toLowerCase().includes('no') ? `De acuerdo. Con tu experiencia principal es más que suficiente para un CV sólido 💼` : `Excelente, tener variedad de experiencias fortalece mucho el CV 📈`,
  logros2: () => `Muy bien. Cada detalle que me das ayuda a construir un CV más completo y convincente 🏆`,
  estudios: () => `Perfecto. Tu formación académica quedará bien estructurada y visible 🎓`,
  certificaciones: (v) => v.toLowerCase().includes('ninguno') ? `No hay problema, tu experiencia habla por sí sola 💪` : `¡Esas certificaciones agregan mucho valor a tu perfil! Los reclutadores las buscan activamente 🏅`,

  habilidades_blandas: () => `Las habilidades blandas son cada vez más valoradas. Las incluiré de forma natural en el CV ✨`,
  idiomas_nivel: (v) => v.toLowerCase().includes('inglés') ? `¡El inglés es un diferenciador enorme en el mercado laboral! Lo destacaré bien 🌐` : `Perfecto. Los idiomas quedarán listados de forma clara 📝`,

  proyectos: (v) => v.toLowerCase().includes('ninguno') ? `No hay problema, muchos profesionales no tienen portafolio y consiguen trabajo igual 💪` : `¡Perfecto! Esos proyectos y participaciones van a diferenciarte enormemente de otros candidatos 🚀`,

  info_extra: null

const sleep = ms => new Promise(r => setTimeout(r, ms));

// ── INIT ──
function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 120) + 'px';
}

function guardarEstado() {
  localStorage.setItem('cvpro_chat16', JSON.stringify({datos, paso, historial}));
}

function reiniciar() {
  if (!confirm('¿Seguro que quieres reiniciar? Perderás el progreso actual.')) return;
  localStorage.removeItem('cvpro_chat16');
  location.reload();
}

async function init() {
  const saved = localStorage.getItem('cvpro_chat16');
  if (saved) {
    try {
      const s = JSON.parse(saved);
      datos = s.datos || {};
      paso = s.paso || 0;
      historial = s.historial || [];
      if (historial.length > 0) {
        historial.forEach(m => renderMsg(m.tipo, m.texto, m.opts||[], false));
        actualizarUI();
        if (paso >= PASOS.length) {
          mostrarGenerando();
        }
        return;
      }
    } catch(e) {}
  }
  // Inicio fresco
  await mostrarTyping(600);
  const p = PASOS[0];
  renderMsgAI(typeof p.preg === 'function' ? p.preg(datos) : p.preg, p.opts||[]);
  setHint(p.hint||'');
  document.getElementById('chatInput').placeholder = p.placeholder||'Escribe aquí...';
  actualizarUI();
}

// ── RENDER ──
function renderMsg(tipo, texto, opts=[], animar=true) {
  const msgs = document.getElementById('chatMessages');
  const div = document.createElement('div');
  div.className = `msg ${tipo}`;
  if (!animar) div.style.animation = 'none';

  if (tipo === 'ai') {
    let optsHtml = opts.length ? `<div class="quick-opts">${opts.map(o=>`<button class="qopt" onclick="selOpt('${o.replace(/'/g,"\\'")}'')">${o}</button>`).join('')}</div>` : '';
    div.innerHTML = `<div class="ai-avatar">CV</div><div><div class="msg-bubble">${texto.replace(/\n/g,'<br>')}</div>${optsHtml}</div>`;
  } else {
    div.innerHTML = `<div class="msg-bubble">${texto}</div>`;
  }

  msgs.appendChild(div);
  msgs.scrollTop = msgs.scrollHeight;
}

function renderMsgAI(texto, opts=[], animar=true) {
  renderMsg('ai', texto, opts, animar);
  historial.push({tipo:'ai', texto, opts});
  guardarEstado();
}

function renderMsgUser(texto) {
  renderMsg('user', texto, [], true);
  historial.push({tipo:'user', texto});
  guardarEstado();
}

async function mostrarTyping(ms=1000) {
  const msgs = document.getElementById('chatMessages');
  const div = document.createElement('div');
  div.id = 'typing-indicator';
  div.className = 'msg ai';
  div.style.animation = 'none';
  div.innerHTML = `<div class="ai-avatar">CV</div><div class="typing"><span></span><span></span><span></span></div>`;
  msgs.appendChild(div);
  msgs.scrollTop = msgs.scrollHeight;
  await sleep(ms);
  div.remove();
}

function setHint(txt) {
  document.getElementById('inputHint').textContent = txt;
}

function selOpt(val) {
  document.getElementById('chatInput').value = val;
  enviar();
}

// ── ENVIAR ──
async function enviar() {
  if (enviando) return;
  const input = document.getElementById('chatInput');
  const texto = input.value.trim();
  if (!texto) return;

  enviando = true;
  input.value = '';
  input.style.height = 'auto';
  document.getElementById('sendBtn').disabled = true;

  renderMsgUser(texto);

  if (paso < PASOS.length) {
    const key = PASOS[paso].key;
    datos[key] = texto;
    paso++;
    actualizarUI();
    guardarEstado();

    const delay = 700 + Math.random() * 500;
    await mostrarTyping(delay);

    // Comentario inteligente
    const fn = COMENTARIOS[key];
    if (fn) {
      const com = typeof fn === 'function' ? fn(texto) : fn;
      if (com) {
        renderMsgAI(com);
        await mostrarTyping(500 + Math.random()*400);
      }
    }

    if (paso < PASOS.length) {
      const next = PASOS[paso];
      const preg = typeof next.preg === 'function' ? next.preg(datos) : next.preg;
      renderMsgAI(preg, next.opts||[]);
      setHint(next.hint||'');
      input.placeholder = next.placeholder||'Escribe aquí...';
    } else {
      await mostrarGenerando();
    }
  }

  enviando = false;
  document.getElementById('sendBtn').disabled = false;
  document.getElementById('chatInput').focus();
}

// ── UI ──
function actualizarUI() {
  const p = Math.min(paso, PASOS.length);
  const pct = Math.round((p / PASOS.length) * 100);
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('stepNum').textContent = Math.min(p + 1, 20);
}

// ── GENERAR CV ──
async function mostrarGenerando() {
  document.getElementById('chatInput').disabled = true;
  document.getElementById('sendBtn').disabled = true;
  document.getElementById('inputHint').textContent = '';
  document.getElementById('chatInput').placeholder = 'Generando tu CV...';

  await mostrarTyping(600);
  renderMsgAI(`¡Perfecto ${datos.nombre?.split(' ')[0]}! 🎉 Tengo toda la información que necesito.\n\nAhora voy a:\n✅ Corregir ortografía y redacción\n✅ Optimizar para filtros ATS\n✅ Crear tu CV profesional completo\n\nEsto tomará unos segundos...`);

  await mostrarTyping(2500);
  const cv = await generarConIA();
  cvGenerado = cv;

  // Guardar en sessionStorage para plantillas
  const cvData = construirCVData();
  sessionStorage.setItem('cvData', JSON.stringify(cvData));
  sessionStorage.setItem('cvTexto', cv);

  // Guardar en Supabase
  await guardarEnSupabase();

  // Mostrar resultado
  mostrarResultado(cv);
  localStorage.removeItem('cvpro_chat16');
}

async function generarConIA() {
  // Parsear email y teléfono
  const ct = datos.email_tel || '';
  const emailM = ct.match(/[\w.+-]+@[\w.-]+\.\w{2,}/);
  const telM = ct.match(/[\+\d][\d\s\-\(\)\.]{6,}/);
  const email = emailM ? emailM[0] : '';
  const telefono = telM ? telM[0].trim() : '';
  const linkedin = datos.linkedin?.toLowerCase().includes('no') ? '' : (datos.linkedin||'');

  const exp2valida = datos.exp2 && !datos.exp2.toLowerCase().match(/solo|no tengo|ninguno/);

  const prompt = `Eres un ghostwriter élite especializado en CVs ejecutivos para Latinoamérica. Tu trabajo: transformar información en bruto del candidato en un CV impecable que consiga entrevistas.

PUESTO OBJETIVO: ${datos.puesto}
PAÍS: ${datos.pais}
EMAIL: ${email} | TELÉFONO: ${telefono}${linkedin ? ' | LINKEDIN: '+linkedin : ''}

PERFIL PERSONAL (palabras del candidato — mejorar redacción):
${datos.resumen_personal}

EXPERIENCIA PRINCIPAL:
Empresa/Cargo/Período: ${datos.exp1}
Logros y responsabilidades: ${datos.logros1}

${exp2valida ? `EXPERIENCIA ANTERIOR:
Empresa/Cargo/Período: ${datos.exp2}
Logros y responsabilidades: ${datos.logros2}` : ''}

FORMACIÓN ACADÉMICA:
${datos.estudios}

CERTIFICACIONES Y LICENCIAS:
${datos.certificaciones}

HABILIDADES TÉCNICAS:
${datos.habilidades_tecnicas}

HABILIDADES BLANDAS:
${datos.habilidades_blandas}

IDIOMAS:
${datos.idiomas_nivel}

DISPONIBILIDAD Y MODALIDAD:
${datos.disponibilidad}

MOVILIDAD GEOGRÁFICA:
${datos.movilidad}

PROYECTOS PERSONALES Y ASOCIACIONES:
${datos.proyectos}

TIPO DE EMPRESA OBJETIVO:
${datos.tipo_empresa}

INFORMACIÓN ADICIONAL:
${datos.info_extra}

══════════════════════════════════════════
INSTRUCCIONES CRÍTICAS — LEE TODO:
══════════════════════════════════════════

CORRECCIÓN: Corrige TODOS los errores de ortografía, gramática y puntuación del candidato. Mejora la redacción manteniendo el significado original.

VERBOS: Usa verbos de acción específicos del sector. NUNCA empieces con "yo" — siempre directo al verbo:
- Aviación: "Piloté", "Coordiné", "Ejecuté", "Operé", "Comandé"
- Tech: "Desarrollé", "Implementé", "Arquitecté", "Optimicé"
- Ventas: "Cerré", "Superé", "Prospecté", "Fidelicé"
- Salud: "Atendí", "Coordiné", "Administré", "Diagnostiqué"
- Admin: "Gestioné", "Reduje", "Supervisé", "Implementé"

RESUMEN: 3-4 líneas que describan al candidato de forma única. PROHIBIDO: "profesional comprometido", "orientado a resultados", "busco oportunidad", "apasionado por". Menciona años de experiencia, sector y propuesta de valor real.

LOGROS: Si el candidato menciona números, úsalos. Si no, infiere logros realistas y creíbles para el cargo. Cuantifica cuando sea posible.

TONO: Seguro, directo, sin relleno. Como si el candidato lo hubiera escrito él mismo con ayuda de un experto.

ATS: Incluye palabras clave técnicas del sector de ${datos.puesto} de forma natural en el texto.

DISPONIBILIDAD: Incluye "${datos.disponibilidad}" en la sección de información adicional de forma natural.
MOVILIDAD: Si aplica, menciona disponibilidad para viajar/reubicarse como punto adicional.
PROYECTOS: Si el candidato tiene proyectos o asociaciones, créales una sección "PROYECTOS Y PARTICIPACIÓN PROFESIONAL".
EMPRESA OBJETIVO: Adapta el tono y palabras clave del CV para resonar con "${datos.tipo_empresa}".
NUNCA menciones que fue generado por IA. El CV debe sonar 100% humano.

══════════════════════════════════════════
FORMATO EXACTO — NO CAMBIAR ESTRUCTURA:
══════════════════════════════════════════

═══════════════════════════════════════════════
${(datos.nombre||'').toUpperCase()}
${datos.puesto} | ${datos.pais} | ${email}${telefono?' | '+telefono:''}${linkedin?' | '+linkedin:''}
═══════════════════════════════════════════════

RESUMEN PROFESIONAL
───────────────────
[3-4 líneas únicas, específicas y sin clichés]

EXPERIENCIA PROFESIONAL
───────────────────────
[CARGO EN MAYÚSCULAS | EMPRESA | PERÍODO]
• [Logro específico con verbo de acción — cuantificado si es posible]
• [Responsabilidad clave que demuestre competencia]
• [Resultado o contribución concreta al negocio]
• [Habilidad técnica o liderazgo demostrado]

${exp2valida ? '[CARGO ANTERIOR | EMPRESA | PERÍODO]\n• [Logro 1]\n• [Logro 2]\n• [Logro 3]' : ''}

EDUCACIÓN Y FORMACIÓN
─────────────────────
[TÍTULO | INSTITUCIÓN | AÑO]
${datos.certificaciones && !datos.certificaciones.toLowerCase().includes('ninguno') ? '[Certificaciones y licencias relevantes]' : ''}

HABILIDADES
───────────
Técnicas: [lista organizada por relevancia]
Blandas: [3-4 cualidades más impactantes]
${datos.idiomas_nivel && !datos.idiomas_nivel.toLowerCase().includes('solo español') ? 'Idiomas: [lista con niveles]' : 'Idiomas: Español (nativo)'}

${datos.info_extra && !datos.info_extra.toLowerCase().match(/nada|ninguno/) ? 'INFORMACIÓN ADICIONAL\n─────────────────────\n[info extra formateada profesionalmente]' : ''}

───────────────────────────────────────────────`;

  try {
    const res = await fetch(`${SUPABASE_URL}/functions/v1/super-service`, {
      method: 'POST',
      headers: {'Content-Type':'application/json','Authorization':`Bearer ${SUPABASE_KEY}`},
      body: JSON.stringify({prompt})
    });
    const data = await res.json();
    return data.cv || fallback(email, telefono);
  } catch(e) {
    return fallback(email, telefono);
  }
}

function fallback(email, tel) {
  return `═══════════════════════════════════════════════
${(datos.nombre||'').toUpperCase()}
${datos.puesto} | ${datos.pais} | ${email}${tel?' | '+tel:''}
═══════════════════════════════════════════════

RESUMEN PROFESIONAL
───────────────────
${datos.resumen_personal}

EXPERIENCIA PROFESIONAL
───────────────────────
${datos.exp1}
${datos.logros1}

EDUCACIÓN
─────────
${datos.estudios}

HABILIDADES
───────────
Técnicas: ${datos.habilidades_tecnicas}
Blandas: ${datos.habilidades_blandas}
Idiomas: ${datos.idiomas_nivel}
───────────────────────────────────────────────`;
}

// ── RESULTADO ──
function mostrarResultado(cv) {
  const msgs = document.getElementById('chatMessages');
  renderMsgAI(`✅ ¡Tu CV está listo!\n\nCorregí la ortografía, optimicé la redacción y lo adapté para ${datos.puesto}. Aquí está la vista previa:`);

  const div = document.createElement('div');
  div.className = 'msg ai';
  div.style.maxWidth = '95%';
  div.innerHTML = `
    <div class="ai-avatar">CV</div>
    <div style="flex:1;min-width:0">
      <div class="result-card">
        <h3>📄 CV Profesional — ${datos.nombre}</h3>
        <div class="cv-preview-wrap">
          <div class="cv-preview blurred" id="cvPreview">${cv}</div>
          <div class="unlock-overlay" id="unlockOverlay">
            <h4>🔒 Tu CV está listo</h4>
            <p>Desbloquea por solo <strong style="color:var(--yellow)">$2.99</strong><br>para ver, copiar y descargar tu CV completo</p>
            <button class="btn-unlock" onclick="desbloquear()">⚡ Desbloquear por $2.99</button>
            <p style="font-size:0.68rem;color:#666;margin-top:8px">💳 PayPal · Visa · Mastercard · Sin suscripción</p>
          </div>
        </div>
        <div class="result-actions" id="resultActions">
          <button class="btn-action btn-copy" onclick="copiar()">📋 Copiar CV</button>
          <button class="btn-action btn-plantilla" onclick="irPlantillas()">🎨 Elegir plantilla</button>
          <button class="btn-action btn-nuevo" onclick="nuevoCV()">🔄 Nuevo CV</button>
        </div>
      </div>
    </div>`;
  msgs.appendChild(div);
  msgs.scrollTop = msgs.scrollHeight;
}

function desbloquear() {
  document.getElementById('cvPreview').classList.remove('blurred');
  document.getElementById('unlockOverlay').style.display = 'none';
  document.getElementById('resultActions').classList.add('visible');
}

function copiar() {
  navigator.clipboard.writeText(cvGenerado).then(() => {
    const btn = document.querySelector('.btn-copy');
    const orig = btn.textContent;
    btn.textContent = '✅ ¡Copiado!';
    btn.style.background = 'var(--green)';
    setTimeout(() => { btn.textContent = orig; btn.style.background = 'var(--yellow)'; }, 2500);
  });
}

function irPlantillas() { window.location.href = 'plantillas-cv.html'; }

function nuevoCV() {
  localStorage.removeItem('cvpro_chat16');
  location.reload();
}

function construirCVData() {
  const ct = datos.email_tel || '';
  const emailM = ct.match(/[\w.+-]+@[\w.-]+\.\w{2,}/);
  const telM = ct.match(/[\+\d][\d\s\-\(\)\.]{6,}/);
  const habs = (datos.habilidades_tecnicas||'').split(',').map((h,i)=>({nombre:h.trim(),nivel:Math.max(60,90-i*7)})).slice(0,6);
  const idiArr = (datos.idiomas_nivel||'Español nativo').split(',').map(i=>{
    const p = i.trim().split(/\s+/);
    return {nombre:p[0], nivel:p.slice(1).join(' ')||'Nativo'};
  });
  const logArr = datos.info_extra && !datos.info_extra.toLowerCase().match(/nada|ninguno/) ? [datos.info_extra] : [];
  return {
    nombre: datos.nombre||'',
    email: emailM?emailM[0]:'',
    telefono: telM?telM[0].trim():'',
    pais: datos.pais||'',
    linkedin: datos.linkedin?.toLowerCase().includes('no')?'':(datos.linkedin||''),
    puesto: datos.puesto||'',
    resumen: datos.resumen_personal||'',
    experiencia: [
      {titulo:datos.puesto||'',empresa:(datos.exp1||'').split(/[—\-|]/)[1]?.trim()||'',periodo:(datos.exp1||'').split(/[—\-|]/)[2]?.trim()||'',bullets:(datos.logros1||'').split('\n').filter(Boolean)},
    ],
    educacion: [{titulo:(datos.estudios||'').split('\n')[0],institucion:'',año:''}],
    habilidades: habs,
    idiomas: idiArr,
    logros: logArr
  };
}

async function guardarEnSupabase() {
  const ct = datos.email_tel || '';
  const emailM = ct.match(/[\w.+-]+@[\w.-]+\.\w{2,}/);
  try {
    await fetch(`${SUPABASE_URL}/rest/v1/clientes`, {
      method:'POST',
      headers:{'Content-Type':'application/json','apikey':SUPABASE_KEY,'Authorization':`Bearer ${SUPABASE_KEY}`,'Prefer':'return=minimal'},
      body: JSON.stringify({nombre:datos.nombre,email:emailM?emailM[0]:'sin-email',pais:datos.pais,puesto:datos.puesto,plan:'basico'})
    });
  } catch(e) {}
}

init();
</script>
