<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1200px;height:630px;background:#080808;font-family:'Inter',sans-serif;display:flex;align-items:center;justify-content:center;overflow:hidden}
.card{text-align:center;padding:60px}
.logo{font-size:3.5rem;font-weight:900;color:#FFD000;margin-bottom:20px;letter-spacing:-2px}
.logo span{color:#fff}
.price{font-size:7rem;font-weight:900;color:#FFD000;line-height:1;letter-spacing:-4px;margin-bottom:20px}
.title{font-size:2rem;font-weight:700;color:#fff;margin-bottom:16px;letter-spacing:-0.5px}
.sub{font-size:1.1rem;color:#666;font-weight:300}
.badge{display:inline-block;background:rgba(255,208,0,0.1);border:1px solid rgba(255,208,0,0.3);color:#FFD000;padding:8px 20px;border-radius:50px;font-size:0.85rem;font-weight:600;margin-bottom:24px;letter-spacing:1px}
</style>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;700;900&display=swap" rel="stylesheet">
</head>
<body>
<div class="card">
  <div class="logo">CV<span>Pro</span></div>
  <div class="badge">✨ IA + 10 Plantillas Profesionales</div>
  <div class="price">$2.99</div>
  <div class="title">Tu CV profesional en minutos</div>
  <div class="sub">Chat guiado · Corrección automática · PDF instantáneo · Latam</div>
</div>
</body>
</html>
