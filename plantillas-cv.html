<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Elige tu plantilla | CVPro</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=Montserrat:wght@300;400;500;600;700&family=Raleway:wght@300;400;500;600;700&family=Lato:wght@300;400;700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Montserrat',sans-serif;background:#111;color:#fff;min-height:100vh}
nav{position:sticky;top:0;z-index:200;display:flex;align-items:center;justify-content:space-between;padding:14px 5%;background:rgba(10,10,10,0.97);backdrop-filter:blur(12px);border-bottom:1px solid #222}
.nav-logo{font-family:'Montserrat',sans-serif;font-size:1.2rem;font-weight:800;color:#FFD000;text-decoration:none}
.nav-logo span{color:#fff}
.nav-back{color:#888;font-size:0.85rem;text-decoration:none;cursor:pointer}
.nav-back:hover{color:#FFD000}

/* ── LAYOUT ── */
.page{max-width:1100px;margin:0 auto;padding:40px 20px 80px}
.page-title{text-align:center;margin-bottom:40px}
.page-title h1{font-family:'Montserrat',sans-serif;font-size:2rem;font-weight:800;color:#FFD000;margin-bottom:8px}
.page-title p{color:#888;font-size:0.9rem}

/* ── GENDER TABS ── */
.gender-tabs{display:flex;gap:10px;justify-content:center;margin-bottom:32px}
.gender-tab{padding:11px 30px;border-radius:50px;font-size:0.88rem;font-weight:700;cursor:pointer;border:2px solid #333;background:transparent;color:#888;transition:all 0.3s;font-family:'Montserrat',sans-serif}
.gender-tab.active{background:#FFD000;color:#000;border-color:#FFD000}

/* ── PLANTILLAS GRID ── */
.templates-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:16px;margin-bottom:36px}
@media(max-width:700px){.templates-grid{grid-template-columns:repeat(2,1fr)}}
.tpl-card{background:#1a1a1a;border:2px solid #2a2a2a;border-radius:14px;overflow:hidden;cursor:pointer;transition:all 0.3s;position:relative}
.tpl-card:hover{border-color:#FFD000;transform:translateY(-4px)}
.tpl-card.selected{border-color:#FFD000;box-shadow:0 0 24px rgba(255,208,0,0.3)}
.tpl-selected-badge{display:none;position:absolute;top:8px;right:8px;background:#FFD000;color:#000;font-size:0.6rem;font-weight:800;padding:3px 8px;border-radius:50px;z-index:2}
.tpl-card.selected .tpl-selected-badge{display:block}

/* MINIATURAS */
.tpl-preview{height:160px;overflow:hidden;position:relative;pointer-events:none}
.tpl-preview .mini{transform:scale(0.22);transform-origin:top left;width:454%;height:454%;pointer-events:none}
.tpl-name{padding:10px 12px;font-size:0.75rem;font-weight:700;color:#ccc;text-align:center;border-top:1px solid #2a2a2a}
.tpl-card.selected .tpl-name{color:#FFD000}

/* ── FOTO UPLOAD ── */
.foto-section{background:#1a1a1a;border:1px solid #2a2a2a;border-radius:16px;padding:24px;margin-bottom:24px}
.foto-section h3{font-size:0.85rem;font-weight:700;color:#FFD000;margin-bottom:16px;letter-spacing:1px;text-transform:uppercase}
.foto-upload-area{border:2px dashed #333;border-radius:12px;padding:20px;text-align:center;cursor:pointer;transition:border-color 0.3s;margin-bottom:16px}
.foto-upload-area:hover{border-color:#FFD000}
.foto-upload-area input{display:none}
.foto-upload-area p{color:#888;font-size:0.82rem;margin-top:8px}

/* AJUSTE FOTO */
.foto-ajuste{display:none}
.foto-ajuste.visible{display:block}
.foto-ajuste h4{font-size:0.78rem;color:#aaa;margin-bottom:10px}
.foto-crop-wrap{position:relative;width:200px;height:200px;margin:0 auto 16px;border-radius:50%;overflow:hidden;border:3px solid #FFD000;background:#222;cursor:move;user-select:none}
.foto-crop-wrap.square{border-radius:12px}
.foto-crop-wrap img{position:absolute;cursor:move;transform-origin:center center}
.crop-controls{display:grid;grid-template-columns:1fr 1fr;gap:12px;max-width:300px;margin:0 auto}
.crop-ctrl{display:flex;flex-direction:column;gap:4px}
.crop-ctrl label{font-size:0.72rem;color:#888}
.crop-ctrl input[type=range]{width:100%;accent-color:#FFD000}
.btn-foto-ok{display:block;width:100%;background:#FFD000;color:#000;font-weight:700;font-size:0.85rem;padding:10px;border:none;border-radius:50px;cursor:pointer;margin-top:12px;font-family:'Montserrat',sans-serif}

/* ── BOTÓN GENERAR ── */
.btn-generar{width:100%;background:#FFD000;color:#000;font-family:'Montserrat',sans-serif;font-weight:800;font-size:1rem;padding:16px;border:none;border-radius:50px;cursor:pointer;transition:transform 0.2s,box-shadow 0.2s;box-shadow:0 0 30px rgba(255,208,0,0.2);margin-top:8px}
.btn-generar:hover{transform:translateY(-2px);box-shadow:0 0 50px rgba(255,208,0,0.4)}

/* ── CV OUTPUT ── */
.cv-result{display:none;max-width:900px;margin:0 auto;padding:20px}
.cv-actions{display:flex;gap:12px;margin-bottom:20px;flex-wrap:wrap}
.btn-pdf{background:#FFD000;color:#000;font-weight:700;padding:12px 28px;border:none;border-radius:50px;cursor:pointer;font-size:0.9rem;transition:transform 0.2s;font-family:'Montserrat',sans-serif}
.btn-pdf:hover{transform:scale(1.04)}
.btn-carta{background:#0d1b2a;color:#FFD000;font-weight:700;padding:12px 28px;border:none;border-radius:50px;cursor:pointer;font-size:0.9rem;font-family:'Montserrat',sans-serif;transition:transform 0.2s}
.btn-carta:hover{transform:scale(1.04)}
.btn-volver{background:transparent;color:#fff;font-weight:600;padding:12px 28px;border:2px solid #444;border-radius:50px;cursor:pointer;font-size:0.9rem;font-family:'Montserrat',sans-serif}
.btn-volver:hover{border-color:#FFD000;color:#FFD000}
#cvFinal{background:#fff}

/* ════════════════════
   PLANTILLAS CSS
════════════════════ */
/* H1 NAVY */
.cv-h1{font-family:'Montserrat',sans-serif;background:#fff;color:#1a1a1a;width:794px;overflow-wrap:break-word;word-break:break-word}
.cv-h1 .hdr{background:#0d1b2a;padding:36px 40px;display:flex;gap:24px;align-items:center}
.cv-h1 .ph{width:100px;height:100px;border-radius:50%;overflow:hidden;border:4px solid #FFD000;flex-shrink:0;background:#2a4a6b;display:flex;align-items:center;justify-content:center;font-size:2rem;color:#FFD000}
.cv-h1 .ph img{width:100%;height:100%;object-fit:cover;display:block}
.cv-h1 .nm{font-size:1.8rem;font-weight:700;color:#fff;line-height:1.1}
.cv-h1 .rl{color:#FFD000;font-size:0.82rem;font-weight:600;letter-spacing:2px;text-transform:uppercase;margin:5px 0 12px}
.cv-h1 .ct{display:flex;flex-wrap:wrap;gap:8px}
.cv-h1 .ci{font-size:0.72rem;color:#ccc}
.cv-h1 .bd{display:grid;grid-template-columns:210px minmax(0,1fr)}
.cv-h1 .sb{background:#f0f4f8;padding:24px 20px}
.cv-h1 .mn{padding:24px 26px}
.cv-h1 .st{font-size:0.6rem;font-weight:700;letter-spacing:3px;text-transform:uppercase;color:#0d1b2a;border-bottom:2px solid #FFD000;padding-bottom:4px;margin-bottom:12px}
.cv-h1 .sk{margin-bottom:8px}
.cv-h1 .sn{font-size:0.72rem;font-weight:600;color:#333;margin-bottom:2px}
.cv-h1 .sb2{height:4px;background:#ddd;border-radius:2px}
.cv-h1 .sf{height:100%;background:linear-gradient(90deg,#0d1b2a,#FFD000);border-radius:2px}
.cv-h1 .jb{margin-bottom:16px;padding-left:12px;border-left:3px solid #FFD000}
.cv-h1 .jt{font-size:0.86rem;font-weight:700;color:#0d1b2a}
.cv-h1 .jm{font-size:0.72rem;color:#666;margin:3px 0 7px}
.cv-h1 .bl{font-size:0.74rem;color:#444;line-height:1.6;margin-bottom:2px;padding-left:10px;position:relative}
.cv-h1 .bl::before{content:'▸';position:absolute;left:0;color:#0d1b2a;font-size:0.65rem}
.cv-h1 .li{display:flex;justify-content:space-between;font-size:0.74rem;margin-bottom:5px}

/* H2 NEGRO DORADO */
.cv-h2{font-family:'Raleway',sans-serif;background:#fff;color:#1a1a1a;width:794px}
.cv-h2 .hdr{background:#111;padding:32px 36px;display:flex;gap:20px;align-items:center}
.cv-h2 .ph{width:90px;height:90px;border-radius:10px;overflow:hidden;border:3px solid #FFD000;flex-shrink:0;background:#222;display:flex;align-items:center;justify-content:center;font-size:1.8rem;color:#FFD000}
.cv-h2 .ph img{width:100%;height:100%;object-fit:cover;display:block}
.cv-h2 .nm{font-size:1.7rem;font-weight:700;color:#fff}
.cv-h2 .rl{color:#FFD000;font-size:0.78rem;font-weight:600;letter-spacing:3px;text-transform:uppercase;margin:4px 0 10px}

.cv-h2 .ct{display:flex;flex-wrap:wrap;gap:10px}
.cv-h2 .ci{font-size:0.7rem;color:#aaa}
.cv-h2 .bd{display:grid;grid-template-columns:1fr 240px}

/* H3 MINIMALISTA */
.cv-h3{font-family:'Lato',sans-serif;background:#fff;color:#1a1a1a;width:794px}
.cv-h3 .hdr{padding:30px 36px;border-bottom:3px solid #1a1a1a;display:flex;justify-content:space-between;align-items:center}

.cv-h3 .ph img{width:100%;height:100%;object-fit:cover;display:block}

.cv-h3 .ci{font-size:0.72rem;color:#888}
.cv-h3 .bd{display:grid;grid-template-columns:1fr 1fr;gap:0;padding:26px 36px}
.cv-h3 .col{padding:0 14px}
.cv-h3 .col:first-child{padding-left:0;border-right:1px solid #eee}

.cv-h3 .st{font-size:0.58rem;font-weight:700;letter-spacing:4px;text-transform:uppercase;color:#1a1a1a;margin-bottom:12px;padding-bottom:3px;border-bottom:2px solid #1a1a1a}
.cv-h3 .jb{margin-bottom:14px}
.cv-h3 .jt{font-size:0.84rem;font-weight:700;color:#1a1a1a}
.cv-h3 .jm{font-size:0.7rem;color:#888;margin:2px 0 5px}
.cv-h3 .bl{font-size:0.72rem;color:#555;line-height:1.6;margin-bottom:2px;padding-left:8px;position:relative}
.cv-h3 .bl::before{content:'·';position:absolute;left:0;font-weight:900}
.cv-h3 .dr{display:flex;justify-content:space-between;align-items:center;margin-bottom:7px}
.cv-h3 .dn{font-size:0.72rem;font-weight:700}
.cv-h3 .ds{display:flex;gap:3px}
.cv-h3 .dot{width:7px;height:7px;border-radius:50%;background:#eee}
.cv-h3 .dot.f{background:#1a1a1a}

/* H4 VERDE OLIVA */

.cv-h4 .ph{width:100px;height:100px;border-radius:50%;overflow:hidden;border:4px solid #c8e6a0;flex-shrink:0;background:#3d6130;display:flex;align-items:center;justify-content:center;font-size:2rem;color:#c8e6a0}

.cv-h4 .nm{font-size:1.7rem;font-weight:700;color:#fff;line-height:1.1}
.cv-h4 .rl{color:#c8e6a0;font-size:0.78rem;font-weight:500;letter-spacing:2px;text-transform:uppercase;margin:4px 0 10px}

.cv-h4 .ci{font-size:0.7rem;color:#b0cc96}

.cv-h4 .sb{background:#f4f8f0;padding:22px 18px;border-right:3px solid #c8e6a0}
.cv-h4 .mn{padding:22px 24px}

.cv-h4 .sk{margin-bottom:8px}
.cv-h4 .sn{font-size:0.72rem;font-weight:600;color:#333;margin-bottom:2px}
.cv-h4 .sb2{height:4px;background:#ddd;border-radius:2px}
.cv-h4 .sf{height:100%;background:#2d4a22;border-radius:2px}
.cv-h4 .jb{margin-bottom:14px;padding-bottom:14px;border-bottom:1px solid #eee}
.cv-h4 .jb:last-child{border:none}
.cv-h4 .jt{font-size:0.84rem;font-weight:700;color:#2d4a22}
.cv-h4 .jm{font-size:0.7rem;color:#888;margin:3px 0 6px}
.cv-h4 .bl{font-size:0.72rem;color:#555;line-height:1.6;margin-bottom:2px;padding-left:10px;position:relative}
.cv-h4 .bl::before{content:'▪';position:absolute;left:0;color:#2d4a22}

/* H5 TECH AZUL */

.cv-m2 .ph{width:100px;height:100px;border-radius:50%;overflow:hidden;border:3px solid #7ecece;flex-shrink:0;background:#1a6b6b;display:flex;align-items:center;justify-content:center;font-size:2rem;color:#7ecece}

.cv-m2 .mn{padding:22px 26px}
.cv-m2 .sb{background:#f0f8f8;padding:22px 18px;border-left:3px solid #7ecece}
.cv-m2 .st{font-size:0.6rem;font-weight:700;letter-spacing:3px;text-transform:uppercase;color:#0d4f4f;margin-bottom:12px;border-bottom:2px solid #7ecece;padding-bottom:3px}

  fotoTitulo:'Agrega tu foto (opcional)', fotoOk:'✓ Usar esta foto', fotoSaltar:'Continuar sin foto',
  hombre:'Estilos hombre', mujer:'Estilos mujer', cargando:'Generando tu CV...'
};

let gender = 'h';

// Cargar datos del sessionStorage

};

// ── CARTA DE PRESENTACIÓN CON IA ──
const SUPABASE_URL_C = 'https://lljmqyejwkgcbuwkgjkh.supabase.co';
const SUPABASE_KEY_C = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imxsam1xeWVqd2tnY2J1d2tnamtoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcxNzc5MzEsImV4cCI6MjEwMjc1MzkzMX0.5zyP9cb9wnkjlPeafe8zBOBPU-joameF0UzxUXDgq60';
let cartaGenerada = '';

async function generarCarta() {
  const btn = document.getElementById('btnCarta');
  if (cartaGenerada) {
    document.getElementById('cartaWrap').style.display = 'block';
    document.getElementById('cartaWrap').scrollIntoView({behavior:'smooth'});
    return;
  }
  btn.disabled = true;
  btn.textContent = LANG==='en' ? '⏳ Writing your letter...' : '⏳ Escribiendo tu carta...';

  const cvTexto = sessionStorage.getItem('cvTexto') || '';
  const prompt = LANG==='en'
    ? `You are an elite cover letter ghostwriter. Based on this resume, write a professional cover letter in ENGLISH for ${D.nombre}, applying as ${D.puesto}. 3-4 paragraphs, confident tone, mention 2-3 concrete achievements from the resume, no placeholders or brackets, ready to send. Start with "Dear Hiring Manager," and end with a professional signature with the candidate's name.\n\nRESUME:\n${cvTexto.substring(0,2500)}`
    : `Eres un ghostwriter élite de cartas de presentación. Basándote en este CV, escribe una carta de presentación profesional en ESPAÑOL para ${D.nombre}, que aplica como ${D.puesto}. 3-4 párrafos, tono seguro y profesional, menciona 2-3 logros concretos del CV, sin corchetes ni placeholders, lista para enviar. Empieza con "Estimado equipo de selección," y termina con firma profesional con el nombre del candidato.\n\nCV:\n${cvTexto.substring(0,2500)}`;

  try {
    const res = await fetch(`${SUPABASE_URL_C}/functions/v1/super-service`, {
      method: 'POST',
      headers: {'Content-Type':'application/json','Authorization':`Bearer ${SUPABASE_KEY_C}`},

    if (data.cv && data.cv.trim().length > 100) {
      cartaGenerada = data.cv.trim().replace(/\*\*/g,'').replace(/\*/g,'');
      document.getElementById('cartaFinal').textContent = cartaGenerada;
      document.getElementById('cartaWrap').style.display = 'block';
      document.getElementById('cartaWrap').scrollIntoView({behavior:'smooth'});
      btn.textContent = LANG==='en' ? '✉️ View cover letter' : '✉️ Ver carta de presentación';
    } else {
      throw new Error('empty');
    }
  } catch(e) {
    alert(LANG==='en' ? 'Could not generate the letter. Try again in 30 seconds.' : 'No se pudo generar la carta. Intenta de nuevo en 30 segundos.');

  }
  btn.disabled = false;
}

function descargarCartaPDF() {
  const el = document.getElementById('cartaFinal');
  if (!el || !cartaGenerada) return;
  const nombre = (D.nombre||'Carta').replace(/\s+/g,'_');

    filename:`${LANG==='en'?'Cover_Letter':'Carta'}_${nombre}.pdf`,

    jsPDF:{unit:'mm',format:'a4',orientation:'portrait'}

}

  document.title = 'Choose your template | CVPro';

  if (btnCarta) btnCarta.textContent = '✉️ Cover letter';
  const btnVolver = document.querySelector('.btn-volver');

  const navBack = document.querySelector('.nav-back');

    if (el.children.length === 0) {
      const t = el.textContent.trim();
      const map = {
        'Agrega tu foto (opcional)':'Add your photo (optional)',
        'Continuar sin foto':'Continue without photo',
        'Volver a plantillas':'Back to templates',
        '← Volver a plantillas':'← Back to templates',
        'Elegir otra plantilla':'Choose another template',
        'Estilos hombre':'Men styles','Estilos mujer':'Women styles',
        'Hombre':'Men','Mujer':'Women',
        'Zoom':'Zoom','Mover':'Move'
      };
      if (map[t]) el.textContent = map[t];
    }
  });
}

  document.querySelectorAll('button, h1, h2, h3, p, span, div').forEach(el => {

    const map = {
      '📄 Descargar PDF': T.descargar, '← Volver a plantillas': T.volver,

      'Continuar sin foto': T.sinFoto, '⚡ Generar mi CV': T.generar,
      'Zoom': T.zoom, 'Arrastra para ajustar': T.mover
    };
    if (map[t]) el.textContent = map[t];
    if (t.startsWith('Todas las plantillas')) el.textContent = T.subtitulo;
  });
  document.title = 'Choose your template | CVPro';
}

}

function renderTemplates() {
  const grid = document.getElementById('templatesGrid');
  grid.innerHTML = TPLS[gender].map(t => `
    <div class="tpl-card ${t.id===selTpl?'selected':''}" onclick="seleccionar('${t.id}')">

        <div class="mini" id="mini-${t.id}">${buildCV(t.id)}</div>
      </div>
      <div class="tpl-name">${t.name}</div>
    </div>
  `).join('');
}

function seleccionar(id) {
  selTpl = id;
  renderTemplates();
  const isSquare = id === 'h2' || id === 'h3';
  document.getElementById('cropWrap').classList.toggle('square', isSquare);
}

function cargarFoto(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    fotoOriginal = ev.target.result;
    mostrarAjuste();
    document.getElementById('uploadTxt').innerHTML = '<strong style="color:#00C853">✅ Foto cargada — ajústala abajo</strong>';
  };
  reader.readAsDataURL(file);
}

function mostrarAjuste() {
  const ajuste = document.getElementById('fotoAjuste');
  ajuste.classList.add('visible');
  ajuste.innerHTML = `
    <h4>Ajusta tu foto dentro del recuadro:</h4>
    <div class="foto-crop-wrap ${selTpl==='h2'||selTpl==='h3'?'square':''}" id="cropWrap">
      <img id="cropImg" src="${fotoOriginal}" draggable="false">
    </div>
    <div class="crop-controls">
      <div class="crop-ctrl"><label>Zoom</label><input type="range" id="zoomCtrl" min="50" max="250" value="130" oninput="actualizarFoto()"></div>
      <div class="crop-ctrl"><label>Vertical</label><input type="range" id="yCtrl" min="-150" max="150" value="0" oninput="actualizarFoto()"></div>
      <div class="crop-ctrl"><label>Horizontal</label><input type="range" id="xCtrl" min="-150" max="150" value="0" oninput="actualizarFoto()"></div>
    </div>
    <button class="btn-foto-ok" onclick="confirmarFoto()">✅ Confirmar ajuste</button>
  `;
  actualizarFoto();
}

function actualizarFoto() {
  const zoomEl = document.getElementById('zoomCtrl');
  const xEl = document.getElementById('xCtrl');
  const yEl = document.getElementById('yCtrl');
  if (!zoomEl) return;
  const zoom = parseFloat(zoomEl.value);
  const x = xEl.value;
  const y = yEl.value;
  const img = document.getElementById('cropImg');
  if (!img) return;
  img.style.width = zoom + '%';
  img.style.height = 'auto';
  img.style.left = '50%';
  img.style.top = '50%';
  img.style.transform = `translate(calc(-50% + ${x}px), calc(-50% + ${y}px))`;
}

async function confirmarFoto() {
  const wrap = document.getElementById('cropWrap');
  const isCircle = !wrap.classList.contains('square');
  const size = 400;
  const canvas = document.createElement('canvas');
  canvas.width = size; canvas.height = size;
  const ctx = canvas.getContext('2d');

  const tmpImg = new Image();
  tmpImg.src = fotoOriginal;
  await new Promise(r => tmpImg.onload = r);

  const zoom = parseFloat(document.getElementById('zoomCtrl').value) / 100;
  const xOff = parseFloat(document.getElementById('xCtrl').value) * 2;
  const yOff = parseFloat(document.getElementById('yCtrl').value) * 2;

  // Mantener proporción original
  const ratio = tmpImg.naturalWidth / tmpImg.naturalHeight;
  let iw, ih;
  if (ratio >= 1) { ih = size * zoom; iw = ih * ratio; }
  else { iw = size * zoom; ih = iw / ratio; }
  const ix = (size - iw) / 2 + xOff;
  const iy = (size - ih) / 2 + yOff;

  // Detectar color dominante de los bordes de la foto
  const sampleCanvas = document.createElement('canvas');
  const sw = tmpImg.naturalWidth, sh = tmpImg.naturalHeight;
  sampleCanvas.width = sw; sampleCanvas.height = sh;
  const sCtx = sampleCanvas.getContext('2d');
  sCtx.drawImage(tmpImg, 0, 0);

  // Muestrear píxeles de los 4 bordes
  let rSum=0, gSum=0, bSum=0, count=0;
  const step = Math.max(1, Math.floor(Math.min(sw,sh)/20));
  const borderPx = Math.floor(Math.min(sw,sh) * 0.08); // 8% del borde

  const sampleRegions = [
    {x:0, y:0, w:borderPx, h:sh},          // borde izquierdo
    {x:sw-borderPx, y:0, w:borderPx, h:sh}, // borde derecho
    {x:0, y:0, w:sw, h:borderPx},           // borde superior
    {x:0, y:sh-borderPx, w:sw, h:borderPx}  // borde inferior
  ];

  sampleRegions.forEach(r => {
    for (let x=r.x; x<r.x+r.w; x+=step) {
      for (let y=r.y; y<r.y+r.h; y+=step) {
        const px = sCtx.getImageData(Math.min(x,sw-1), Math.min(y,sh-1), 1, 1).data;
        rSum+=px[0]; gSum+=px[1]; bSum+=px[2]; count++;
      }
    }
  });

  const br = Math.round(rSum/count);
  const bg = Math.round(gSum/count);
  const bb = Math.round(bSum/count);

  // Rellenar canvas con color dominante del borde
  ctx.fillStyle = `rgb(${br},${bg},${bb})`;
  ctx.fillRect(0, 0, size, size);

  // Clip circular si aplica
  if (isCircle) {
    ctx.save();
    ctx.beginPath();
    ctx.arc(size/2, size/2, size/2, 0, Math.PI*2);
    ctx.clip();
  }

  ctx.drawImage(tmpImg, ix, iy, iw, ih);
  if (isCircle) ctx.restore();
  fotoAjustada = canvas.toDataURL('image/jpeg', 0.95);

  const ajuste = document.getElementById('fotoAjuste');
  ajuste.innerHTML = `
    <div style="text-align:center">
      <img src="${fotoAjustada}" style="width:90px;height:90px;border-radius:${isCircle?'50%':'10px'};border:3px solid #FFD000;object-fit:cover;margin-bottom:8px">
      <p style="color:#00C853;font-size:0.82rem;font-weight:700">✅ Foto ajustada correctamente</p>
      <div style="display:flex;gap:8px;justify-content:center;margin-top:8px">
        <button onclick="mostrarAjuste()" style="background:transparent;color:#FFD000;border:1px solid #FFD000;border-radius:20px;padding:5px 14px;font-size:0.75rem;cursor:pointer;font-family:'Montserrat',sans-serif">✏️ Reajustar</button>
        <button onclick="document.getElementById('fotoInput').click()" style="background:transparent;color:#888;border:1px solid #444;border-radius:20px;padding:5px 14px;font-size:0.75rem;cursor:pointer;font-family:'Montserrat',sans-serif">📷 Cambiar foto</button>
      </div>
    </div>`;
  renderTemplates();
}

function ph(cls, isRect) {
  if (fotoAjustada) {
    if (isRect) return `<div class="ph-rect"><img src="${fotoAjustada}"></div>`;
    return `<div class="ph"><img src="${fotoAjustada}"></div>`;
  }
  const ini = (D.nombre||'?').split(' ').map(w=>w[0]).join('').substring(0,2).toUpperCase();
  if (isRect) return `<div class="ph-rect">${ini}</div>`;
  return `<div class="ph">${ini}</div>`;
}

function bls(cls, arr) { return arr.map(b=>`<div class="bl">${b}</div>`).join(''); }
function skills(cls, arr) { return arr.map(s=>`<div class="sk"><div class="sn">${s.nombre}</div><div class="sb2"><div class="sf" style="width:${s.nivel}%"></div></div></div>`).join(''); }
function jobs(cls, arr) { return arr.map(j=>`<div class="jb"><div class="jt">${j.titulo}</div><div class="jm">${j.empresa} · ${j.periodo}</div>${bls(cls,j.bullets)}</div>`).join(''); }
function edu(arr) { return arr.map(e=>`<p style="font-size:0.74rem;margin-bottom:6px"><strong>${e.titulo}</strong><br><span style="color:#888">${e.institucion} · ${e.año}</span></p>`).join(''); }
function ct(cls) { return `<span class="ci">✉ ${D.email}</span>${D.telefono?`<span class="ci">📱 ${D.telefono}</span>`:''}${D.pais?`<span class="ci">📍 ${D.pais}</span>`:''}${D.linkedin?`<span class="ci">🔗 ${D.linkedin}</span>`:''}` }

// ── P3: CARTA DE PRESENTACIÓN CON IA ──
async function generarCarta() {
  const btn = document.getElementById('btnCarta');
  btn.disabled = true;
  btn.textContent = LANG==='en' ? '⏳ Writing your cover letter...' : '⏳ Redactando tu carta...';
  const cvTexto = sessionStorage.getItem('cvTexto') || '';
  const prompt = LANG==='en'
    ? `You are an elite cover letter ghostwriter. Based on this resume, write a professional cover letter in ENGLISH for ${D.nombre}, applying as ${D.puesto}. 3-4 paragraphs: hook + value proposition with 2 quantified achievements + culture fit + call to action. No placeholders, no brackets, ready to send. Sign with the candidate name.\n\nRESUME:\n${cvTexto.substring(0,2500)}`
    : `Eres un ghostwriter élite de cartas de presentación. Con base en este CV, escribe una carta de presentación profesional en ESPAÑOL para ${D.nombre}, aplicando como ${D.puesto}. 3-4 párrafos: gancho + propuesta de valor con 2 logros cuantificados + fit cultural + llamado a la acción. Sin corchetes ni placeholders, lista para enviar. Firma con el nombre del candidato.\n\nCV:\n${cvTexto.substring(0,2500)}`;
  try {
    const res = await fetch(`${SUPABASE_URL}/functions/v1/super-service`, {
      method:'POST', headers:{'Content-Type':'application/json','Authorization':`Bearer ${SUPABASE_KEY}`},
      body: JSON.stringify({prompt})
    });
    const data = await res.json();
    if (!data.cv || data.cv.length < 200) throw new Error('short');
    mostrarCarta(data.cv.trim());
  } catch(e) {
    alert(LANG==='en' ? 'Could not generate the letter. Try again in 30 seconds.' : 'No se pudo generar la carta. Intenta de nuevo en 30 segundos.');
  }
  btn.disabled = false;
  btn.textContent = LANG==='en' ? '✉️ Generate cover letter (AI)' : '✉️ Generar carta de presentación (IA)';
}

function descargarCartaPDF() {
  const body = document.getElementById('cartaBody');
  const wrap = document.createElement('div');

  wrap.textContent = body.textContent;
  document.body.appendChild(wrap);
  const nombre = (D.nombre||'Carta').replace(/\s+/g,'_');
  html2pdf().set({margin:0,filename:LANG==='en'?`Cover_Letter_${nombre}.pdf`:`Carta_${nombre}.pdf`,image:{type:'jpeg',quality:0.98},html2canvas:{scale:2},jsPDF:{unit:'mm',format:'a4'}}).from(wrap).save().then(()=>wrap.remove());

function descargarPDF() {
  const el = document.getElementById('cvFinal').firstElementChild;
  if (!el) return;
  const nombre = (D.nombre||'CV').replace(/\s+/g,'_');
  html2pdf().set({
    margin:0,
    filename:`CV_${nombre}.pdf`,
    image:{type:'jpeg',quality:0.98},
    html2canvas:{scale:2,useCORS:true,logging:false},
    jsPDF:{unit:'mm',format:'a4',orientation:'portrait'}
  }).from(el).save();
}
