<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CV Profesional | CVPro</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=Montserrat:wght@300;400;500;600;700&family=Raleway:wght@300;400;500;600;700&family=Lato:wght@300;400;700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Montserrat',sans-serif;background:#1a1a1a;color:#fff;min-height:100vh}

/* ── SELECTOR UI ── */
.selector-ui{max-width:900px;margin:0 auto;padding:40px 20px}
.selector-header{text-align:center;margin-bottom:40px}
.selector-header h1{font-family:'Playfair Display',serif;font-size:2.5rem;color:#FFD000;margin-bottom:10px}
.selector-header p{color:#888;font-size:0.95rem}

.gender-tabs{display:flex;gap:12px;justify-content:center;margin-bottom:32px}
.gender-tab{padding:12px 32px;border-radius:50px;font-size:0.9rem;font-weight:600;cursor:pointer;border:2px solid #333;background:transparent;color:#888;transition:all 0.3s}
.gender-tab.active{background:#FFD000;color:#000;border-color:#FFD000}

.templates-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:16px;margin-bottom:32px}
.template-card{background:#222;border:2px solid #333;border-radius:12px;overflow:hidden;cursor:pointer;transition:all 0.3s}
.template-card:hover{border-color:#FFD000;transform:translateY(-4px)}
.template-card.selected{border-color:#FFD000;box-shadow:0 0 20px rgba(255,208,0,0.3)}
.template-preview{height:120px;display:flex;align-items:center;justify-content:center;font-size:2rem}
.template-name{padding:10px;text-align:center;font-size:0.78rem;font-weight:600;color:#ccc}
.template-card.selected .template-name{color:#FFD000}

.photo-upload{background:#222;border:2px dashed #444;border-radius:16px;padding:30px;text-align:center;margin-bottom:24px;cursor:pointer;transition:border-color 0.3s}
.photo-upload:hover{border-color:#FFD000}
.photo-upload input{display:none}
.photo-preview{width:100px;height:100px;border-radius:50%;object-fit:cover;margin:0 auto 12px;display:block;border:3px solid #FFD000}
.photo-upload p{color:#888;font-size:0.85rem}
.photo-upload strong{color:#FFD000}

.btn-generate{width:100%;background:#FFD000;color:#000;font-family:'Montserrat',sans-serif;font-weight:700;font-size:1rem;padding:16px;border:none;border-radius:50px;cursor:pointer;transition:transform 0.2s,box-shadow 0.2s;box-shadow:0 0 30px rgba(255,208,0,0.2)}
.btn-generate:hover{transform:translateY(-2px);box-shadow:0 0 50px rgba(255,208,0,0.4)}

/* ── CV CONTAINER ── */
.cv-container{display:none;max-width:900px;margin:0 auto;padding:20px}
.cv-actions{display:flex;gap:12px;margin-bottom:20px;flex-wrap:wrap}
.btn-pdf{background:#FFD000;color:#000;font-weight:700;padding:12px 28px;border:none;border-radius:50px;cursor:pointer;font-size:0.9rem;transition:transform 0.2s}
.btn-pdf:hover{transform:scale(1.04)}
.btn-back{background:transparent;color:#fff;font-weight:600;padding:12px 28px;border:2px solid #444;border-radius:50px;cursor:pointer;font-size:0.9rem;transition:border-color 0.2s}
.btn-back:hover{border-color:#FFD000;color:#FFD000}

/* ════════════════════════════════════
   PLANTILLAS HOMBRE
════════════════════════════════════ */

/* H1 — EJECUTIVO NAVY */
.cv-h1{font-family:'Montserrat',sans-serif;background:#fff;color:#1a1a1a;width:100%;max-width:794px;margin:0 auto}
.cv-h1 .header{background:linear-gradient(135deg,#0d1b2a,#1b3a5c);padding:40px;display:flex;gap:28px;align-items:center}
.cv-h1 .photo-wrap{flex-shrink:0}
.cv-h1 .photo-wrap{width:110px;height:110px;border-radius:50%;border:4px solid #FFD000;overflow:hidden;flex-shrink:0}
.cv-h1 .photo-wrap img{width:100%;height:100%;object-fit:cover;object-position:center top;display:block}
.cv-h1 .photo-placeholder{width:110px;height:110px;border-radius:50%;border:4px solid #FFD000;background:#2a4a6b;display:flex;align-items:center;justify-content:center;font-size:2.5rem;color:#FFD000}
.cv-h1 .name{font-size:2rem;font-weight:700;color:#fff;letter-spacing:1px;line-height:1.1}
.cv-h1 .role{color:#FFD000;font-size:0.95rem;font-weight:500;margin:6px 0 14px;letter-spacing:2px;text-transform:uppercase}
.cv-h1 .contacts{display:flex;flex-wrap:wrap;gap:10px}
.cv-h1 .contact-item{font-size:0.75rem;color:#ccc;display:flex;align-items:center;gap:5px}
.cv-h1 .body{display:grid;grid-template-columns:220px 1fr}
.cv-h1 .sidebar{background:#f0f4f8;padding:28px 22px}
.cv-h1 .main{padding:28px}
.cv-h1 .sec-title{font-size:0.65rem;font-weight:700;letter-spacing:3px;text-transform:uppercase;color:#1b3a5c;border-bottom:2px solid #FFD000;padding-bottom:5px;margin-bottom:14px}
.cv-h1 .skill-item{margin-bottom:10px}
.cv-h1 .skill-name{font-size:0.75rem;font-weight:600;color:#333;margin-bottom:3px}
.cv-h1 .skill-bar{height:5px;background:#ddd;border-radius:3px}
.cv-h1 .skill-fill{height:100%;background:linear-gradient(90deg,#1b3a5c,#FFD000);border-radius:3px}
.cv-h1 .job{margin-bottom:18px;padding-left:14px;border-left:3px solid #FFD000}
.cv-h1 .job-title{font-size:0.9rem;font-weight:700;color:#0d1b2a}
.cv-h1 .job-meta{font-size:0.75rem;color:#666;margin:3px 0 8px}
.cv-h1 .bullet{font-size:0.78rem;color:#444;line-height:1.6;margin-bottom:3px;padding-left:12px;position:relative}
.cv-h1 .bullet::before{content:'▸';position:absolute;left:0;color:#1b3a5c}
.cv-h1 .sec-s{margin-bottom:20px}
.cv-h1 .lang-item{display:flex;justify-content:space-between;font-size:0.78rem;margin-bottom:6px}
.cv-h1 .lang-dot{color:#1b3a5c;font-weight:600}
.cv-h1 .tag{display:inline-block;background:#e8f0fe;color:#1b3a5c;font-size:0.7rem;padding:3px 8px;border-radius:4px;margin:2px;font-weight:500}

/* H2 — CREATIVO NEGRO DORADO */
.cv-h2{font-family:'Raleway',sans-serif;background:#fff;color:#1a1a1a;width:100%;max-width:794px;margin:0 auto}
.cv-h2 .header{background:#111;padding:36px 40px;position:relative;overflow:hidden}
.cv-h2 .header::before{content:'';position:absolute;top:-30px;right:-30px;width:200px;height:200px;border-radius:50%;border:40px solid rgba(255,208,0,0.1)}
.cv-h2 .header::after{content:'';position:absolute;bottom:-50px;right:60px;width:150px;height:150px;border-radius:50%;border:30px solid rgba(255,208,0,0.08)}
.cv-h2 .header-inner{display:flex;gap:24px;align-items:center;position:relative;z-index:1}
.cv-h2 .photo-wrap img,.cv-h2 .photo-placeholder{width:100px;height:100px;border-radius:12px;object-fit:cover;border:3px solid #FFD000;background:#222;display:flex;align-items:center;justify-content:center;font-size:2rem;color:#FFD000;flex-shrink:0}
.cv-h2 .name{font-size:1.9rem;font-weight:700;color:#fff;letter-spacing:-0.5px}
.cv-h2 .role{color:#FFD000;font-size:0.85rem;font-weight:600;letter-spacing:3px;text-transform:uppercase;margin:5px 0 12px}
.cv-h2 .gold-line{width:50px;height:3px;background:#FFD000;margin-bottom:12px}
.cv-h2 .contacts{display:flex;flex-wrap:wrap;gap:12px}
.cv-h2 .ci{font-size:0.73rem;color:#aaa}
.cv-h2 .body{display:grid;grid-template-columns:1fr 260px}
.cv-h2 .main{padding:28px 30px}
.cv-h2 .sidebar{background:#f9f9f9;padding:28px 22px;border-left:1px solid #eee}
.cv-h2 .sec-title{font-size:0.7rem;font-weight:700;letter-spacing:3px;text-transform:uppercase;color:#111;margin-bottom:14px;display:flex;align-items:center;gap:8px}
.cv-h2 .sec-title::after{content:'';flex:1;height:1px;background:#FFD000}
.cv-h2 .job{margin-bottom:18px}
.cv-h2 .job-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:4px}
.cv-h2 .job-title{font-size:0.9rem;font-weight:700;color:#111}
.cv-h2 .job-date{font-size:0.7rem;background:#111;color:#FFD000;padding:3px 8px;border-radius:4px}
.cv-h2 .job-company{font-size:0.78rem;color:#666;margin-bottom:8px}
.cv-h2 .bullet{font-size:0.77rem;color:#444;line-height:1.6;margin-bottom:3px;padding-left:14px;position:relative}
.cv-h2 .bullet::before{content:'→';position:absolute;left:0;color:#FFD000;font-size:0.65rem}
.cv-h2 .skill-wrap{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.cv-h2 .skill-tag{background:#111;color:#FFD000;font-size:0.7rem;padding:4px 10px;border-radius:4px;font-weight:600}
.cv-h2 .edu-item{margin-bottom:12px}
.cv-h2 .edu-title{font-size:0.82rem;font-weight:700;color:#111}
.cv-h2 .edu-sub{font-size:0.72rem;color:#888}

/* H3 — MINIMALISTA CARBÓN */
.cv-h3{font-family:'Lato',sans-serif;background:#fff;color:#1a1a1a;width:100%;max-width:794px;margin:0 auto}
.cv-h3 .header{padding:36px 40px;border-bottom:3px solid #2d2d2d;display:flex;justify-content:space-between;align-items:center}
.cv-h3 .header-left{flex:1}
.cv-h3 .name{font-size:2.2rem;font-weight:900;color:#1a1a1a;letter-spacing:-1px;line-height:1}
.cv-h3 .role{font-size:0.85rem;font-weight:300;color:#666;letter-spacing:4px;text-transform:uppercase;margin-top:6px}
.cv-h3 .photo-wrap img,.cv-h3 .photo-placeholder{width:90px;height:90px;border-radius:8px;object-fit:cover;background:#eee;display:flex;align-items:center;justify-content:center;font-size:2rem;color:#666;flex-shrink:0}
.cv-h3 .contacts{display:flex;gap:20px;margin-top:12px;flex-wrap:wrap}
.cv-h3 .ci{font-size:0.75rem;color:#888}
.cv-h3 .body{display:grid;grid-template-columns:1fr 1fr;gap:0;padding:30px 40px}
.cv-h3 .col{padding:0 16px}
.cv-h3 .col:first-child{padding-left:0;border-right:1px solid #eee}
.cv-h3 .col:last-child{padding-right:0}
.cv-h3 .sec-title{font-size:0.62rem;font-weight:700;letter-spacing:4px;text-transform:uppercase;color:#1a1a1a;margin-bottom:14px;padding-bottom:4px;border-bottom:2px solid #1a1a1a}
.cv-h3 .job{margin-bottom:16px}
.cv-h3 .job-title{font-size:0.88rem;font-weight:700;color:#1a1a1a}
.cv-h3 .job-meta{font-size:0.72rem;color:#888;margin:2px 0 6px}
.cv-h3 .bullet{font-size:0.76rem;color:#555;line-height:1.6;margin-bottom:2px;padding-left:10px;position:relative}
.cv-h3 .bullet::before{content:'·';position:absolute;left:0;font-weight:900;color:#1a1a1a}
.cv-h3 .skill-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.cv-h3 .skill-name{font-size:0.75rem;font-weight:700}
.cv-h3 .dots{display:flex;gap:3px}
.cv-h3 .dot{width:8px;height:8px;border-radius:50%;background:#eee}
.cv-h3 .dot.filled{background:#1a1a1a}

/* H4 — ELEGANTE VERDE OLIVA */
.cv-h4{font-family:'Poppins',sans-serif;background:#fff;color:#1a1a1a;width:100%;max-width:794px;margin:0 auto}
.cv-h4 .header{background:#2d4a22;padding:36px 40px;display:flex;gap:24px;align-items:flex-start}
.cv-h4 .photo-wrap img,.cv-h4 .photo-placeholder{width:105px;height:105px;border-radius:50%;border:4px solid #c8e6a0;object-fit:cover;background:#3d6130;display:flex;align-items:center;justify-content:center;font-size:2.5rem;color:#c8e6a0;flex-shrink:0}
.cv-h4 .name{font-size:1.8rem;font-weight:700;color:#fff;line-height:1.1}
.cv-h4 .role{color:#c8e6a0;font-size:0.82rem;font-weight:500;letter-spacing:2px;text-transform:uppercase;margin:5px 0 14px}
.cv-h4 .contacts{display:flex;flex-direction:column;gap:5px}
.cv-h4 .ci{font-size:0.73rem;color:#b0cc96}
.cv-h4 .body{display:grid;grid-template-columns:240px 1fr}
.cv-h4 .sidebar{background:#f4f8f0;padding:26px 20px;border-right:3px solid #c8e6a0}
.cv-h4 .main{padding:26px 28px}
.cv-h4 .sec-title{font-size:0.63rem;font-weight:700;letter-spacing:3px;text-transform:uppercase;color:#2d4a22;margin-bottom:12px;padding:4px 8px;background:#e8f5d8;border-left:3px solid #2d4a22}
.cv-h4 .skill-item{margin-bottom:8px}
.cv-h4 .skill-name{font-size:0.75rem;font-weight:600;color:#333;margin-bottom:3px}
.cv-h4 .skill-bar{height:4px;background:#ddd;border-radius:2px}
.cv-h4 .skill-fill{height:100%;background:#2d4a22;border-radius:2px}
.cv-h4 .job{margin-bottom:16px;padding-bottom:16px;border-bottom:1px solid #eee}
.cv-h4 .job:last-child{border:none}
.cv-h4 .job-title{font-size:0.88rem;font-weight:700;color:#2d4a22}
.cv-h4 .job-meta{font-size:0.73rem;color:#888;margin:3px 0 7px}
.cv-h4 .bullet{font-size:0.76rem;color:#555;line-height:1.6;margin-bottom:3px;padding-left:12px;position:relative}
.cv-h4 .bullet::before{content:'▪';position:absolute;left:0;color:#2d4a22}

/* H5 — TECH AZUL ELÉCTRICO */
.cv-h5{font-family:'Montserrat',sans-serif;background:#fff;color:#1a1a1a;width:100%;max-width:794px;margin:0 auto}
.cv-h5 .header{background:#0a0a0a;padding:0;display:flex}
.cv-h5 .header-photo{width:160px;flex-shrink:0;position:relative;overflow:hidden}
.cv-h5 .header-photo img,.cv-h5 .photo-placeholder{width:100%;height:100%;min-height:160px;object-fit:cover;background:#1a1a2e;display:flex;align-items:center;justify-content:center;font-size:3rem;color:#00d4ff}
.cv-h5 .header-info{flex:1;padding:28px 32px;position:relative}
.cv-h5 .header-info::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:linear-gradient(180deg,#00d4ff,#0066ff)}
.cv-h5 .name{font-size:1.8rem;font-weight:700;color:#fff;line-height:1.1}
.cv-h5 .role{color:#00d4ff;font-size:0.8rem;font-weight:600;letter-spacing:3px;text-transform:uppercase;margin:5px 0 14px}
.cv-h5 .contacts{display:flex;flex-wrap:wrap;gap:10px}
.cv-h5 .ci{font-size:0.72rem;color:#aaa}
.cv-h5 .body{display:grid;grid-template-columns:1fr 220px}
.cv-h5 .main{padding:26px 30px}
.cv-h5 .sidebar{background:#f5f9ff;padding:26px 20px;border-left:1px solid #e0eeff}
.cv-h5 .sec-title{font-size:0.62rem;font-weight:700;letter-spacing:3px;text-transform:uppercase;color:#0066ff;margin-bottom:14px;border-bottom:2px solid #00d4ff;padding-bottom:4px}
.cv-h5 .job{margin-bottom:16px;padding-left:12px;border-left:2px solid #0066ff}
.cv-h5 .job-title{font-size:0.88rem;font-weight:700;color:#0a0a0a}
.cv-h5 .job-meta{font-size:0.72rem;color:#666;margin:3px 0 7px}
.cv-h5 .bullet{font-size:0.76rem;color:#444;line-height:1.6;margin-bottom:3px;padding-left:10px;position:relative}
.cv-h5 .bullet::before{content:'>';position:absolute;left:0;color:#0066ff;font-weight:700;font-size:0.65rem}
.cv-h5 .skill-tag{display:inline-block;background:#e0eeff;color:#0066ff;font-size:0.68rem;padding:3px 8px;border-radius:4px;margin:2px;font-weight:600}
.cv-h5 .skill-bar-wrap{margin-bottom:8px}
.cv-h5 .skill-name{font-size:0.73rem;font-weight:600;margin-bottom:3px}
.cv-h5 .skill-bar{height:4px;background:#ddd;border-radius:2px}
.cv-h5 .skill-fill{height:100%;background:linear-gradient(90deg,#0066ff,#00d4ff);border-radius:2px}

/* ════════════════════════════════════
   PLANTILLAS MUJER
════════════════════════════════════ */

/* M1 — ELEGANTE ROSA GOLD */

/* M2 — CORPORATIVA TEAL */

.cv-m2 .skill-item{margin-bottom:10px}
.cv-m2 .skill-name{font-size:0.75rem;font-weight:600;color:#333;margin-bottom:3px}

<body>

<!-- ── SELECTOR ── -->
<div class="selector-ui" id="selectorUI">
  <div class="selector-header">
    <h1>Elige tu plantilla</h1>
    <p>Selecciona género y la plantilla que mejor refleje tu personalidad profesional</p>
  </div>

  <div class="gender-tabs">
    <button class="gender-tab active" onclick="setGender('h')">👔 Hombre</button>
    <button class="gender-tab" onclick="setGender('m')">👩 Mujer</button>
  </div>

  <div class="templates-grid" id="templatesGrid"></div>

  <div class="photo-upload" onclick="document.getElementById('photoInput').click()">
    <input type="file" id="photoInput" accept="image/*" onchange="loadPhoto(event)">
    <img id="photoPreview" class="photo-preview" style="display:none">
    <p id="uploadText"><strong>📸 Subir foto profesional</strong><br>Haz clic para seleccionar (JPG, PNG)</p>
  </div>

  <button class="btn-generate" onclick="generarCV()">⚡ Generar mi CV con esta plantilla</button>
</div>

<!-- ── CV RESULTADO ── -->
<div class="cv-container" id="cvContainer">
  <div class="cv-actions">
    <button class="btn-pdf" onclick="descargarPDF()">📄 Descargar PDF</button>
    <button class="btn-back" onclick="volver()">← Cambiar plantilla</button>
  </div>
  <div id="cvOutput"></div>
</div>

<script>
const TEMPLATES = {
  h:[
    {id:'h1',name:'Ejecutivo Navy',emoji:'🔵',desc:'Corporativo'},
    {id:'h2',name:'Negro Dorado',emoji:'⭐',desc:'Creativo'},
    {id:'h3',name:'Minimalista',emoji:'⬜',desc:'Moderno'},
    {id:'h4',name:'Verde Oliva',emoji:'🟢',desc:'Elegante'},
    {id:'h5',name:'Tech Azul',emoji:'💻',desc:'Tecnológico'},
  ],
  m:[
    {id:'m1',name:'Rosa Gold',emoji:'💜',desc:'Elegante'},
    {id:'m2',name:'Corporativa Teal',emoji:'🩵',desc:'Profesional'},
    {id:'m3',name:'Moderna Naranja',emoji:'🟠',desc:'Dinámica'},
    {id:'m4',name:'Sofisticada',emoji:'🍷',desc:'Burdeos'},
    {id:'m5',name:'Lavanda',emoji:'💐',desc:'Fresca'},
  ]
};

let gender = 'h';
let selectedTemplate = 'h1';
let photoData = null;

const CV_DATA = JSON.parse(sessionStorage.getItem('cvData') || 'null') || {
  nombre:'Carlos Mendoza', email:'carlos@email.com', telefono:'+57 300 000 0000',
  pais:'Colombia', linkedin:'linkedin.com/in/carlos', puesto:'Desarrollador Web Senior',
  resumen:'Desarrollador con 5 años transformando ideas en productos digitales de alto impacto. Especialista en React y Node.js con enfoque en rendimiento y experiencia de usuario. He liderado equipos de hasta 8 personas y entregado proyectos que generan millones en revenue.',
  experiencia:[
    {titulo:'Senior Frontend Developer',empresa:'TechCorp Colombia',periodo:'2022 — Presente',bullets:['Lideré migración a React que redujo tiempo de carga 40%','Desarrollé 12 componentes reutilizables usados por 5 equipos','Mentoré a 3 desarrolladores junior elevando calidad del código']},
    {titulo:'Web Developer',empresa:'StartupXYZ · Bogotá',periodo:'2020 — 2022',bullets:['Construí plataforma e-commerce con $2M en transacciones anuales','Optimicé base de datos reduciendo queries en 60%']}
  ],
  educacion:[{titulo:'Ing. de Sistemas',institucion:'Universidad Nacional',año:'2019'}],
  habilidades:[{nombre:'React / Next.js',nivel:90},{nombre:'Node.js',nivel:80},{nombre:'PostgreSQL',nivel:75},{nombre:'AWS / Docker',nivel:65}],
  idiomas:[{nombre:'Español',nivel:'Nativo'},{nombre:'Inglés',nivel:'Intermedio'}],
  logros:['Mejor desarrollador del año 2023','Speaker en JSConf Colombia 2022','Proyecto open source con 500+ estrellas en GitHub']
};

function setGender(g) {
  gender = g;
  document.querySelectorAll('.gender-tab').forEach((t,i) => t.classList.toggle('active', (g==='h'&&i===0)||(g==='m'&&i===1)));
  selectedTemplate = g === 'h' ? 'h1' : 'm1';
  renderTemplates();
}

function renderTemplates() {
  const grid = document.getElementById('templatesGrid');
  grid.innerHTML = TEMPLATES[gender].map(t => `
    <div class="template-card ${t.id===selectedTemplate?'selected':''}" onclick="selectTemplate('${t.id}')">
      <div class="template-preview">${t.emoji}</div>
      <div class="template-name">${t.name}<br><span style="font-size:0.65rem;opacity:0.6">${t.desc}</span></div>
    </div>
  `).join('');
}

function selectTemplate(id) {
  selectedTemplate = id;
  renderTemplates();
}

function loadPhoto(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    photoData = ev.target.result;
    const prev = document.getElementById('photoPreview');
    prev.src = photoData;
    prev.style.display = 'block';
    document.getElementById('uploadText').innerHTML = '<strong style="color:#00C853">✅ Foto cargada correctamente</strong>';
  };
  reader.readAsDataURL(file);
}

function photoEl(cls) {
  if (photoData) return `<img src="${photoData}" class="photo-wrap" style="width:105px;height:105px;border-radius:50%;object-fit:cover;border:4px solid currentColor">`;
  const ini = (CV_DATA.nombre||'?').split(' ').map(w=>w[0]).join('').substring(0,2).toUpperCase();
  return `<div class="photo-placeholder">${ini}</div>`;
}

function bullets(arr) { return arr.map(b=>`<div class="bullet">${b}</div>`).join(''); }
function skillBars(items, cls) { return items.map(s=>`<div class="${cls}-item"><div class="${cls}-name">${s.nombre}</div><div class="${cls}-bar"><div class="${cls}-fill" style="width:${s.nivel}%"></div></div></div>`).join(''); }
function contacts(cls) { return `<span class="ci">✉ ${CV_DATA.email}</span>${CV_DATA.telefono?`<span class="ci">📱 ${CV_DATA.telefono}</span>`:''}${CV_DATA.linkedin?`<span class="ci">🔗 ${CV_DATA.linkedin}</span>`:''}${CV_DATA.pais?`<span class="ci">📍 ${CV_DATA.pais}</span>`:''}` }
function jobs(cls) { return CV_DATA.experiencia.map(j=>`<div class="${cls}-job"><div class="${cls}-job-title">${j.titulo}</div><div class="${cls}-job-meta">${j.empresa} · ${j.periodo}</div>${bullets(j.bullets).replace(/class="bullet"/g,`class="${cls}-bullet"`)}</div>`).join(''); }

function buildCV(id) {
  const d = CV_DATA;
  const ini = (d.nombre||'?').split(' ').map(w=>w[0]).join('').substring(0,2).toUpperCase();
  const ph = photoData ? `<div style="width:110px;height:110px;border-radius:50%;overflow:hidden;border:4px solid #FFD000;flex-shrink:0"><img src="${photoData}" style="width:100%;height:100%;object-fit:cover;object-position:center top;display:block"></div>` : `<div class="photo-placeholder">${ini}</div>`;
  const ph_sq = photoData ? `<div style="width:100px;height:100px;border-radius:12px;overflow:hidden;border:3px solid #FFD000;flex-shrink:0"><img src="${photoData}" style="width:100%;height:100%;object-fit:cover;object-position:center top;display:block"></div>` : `<div class="photo-placeholder">${ini}</div>`;
  const ph_rect = photoData ? `<div style="width:160px;height:100%;min-height:160px;overflow:hidden;flex-shrink:0"><img src="${photoData}" style="width:100%;height:100%;object-fit:cover;object-position:center top;display:block"></div>` : `<div class="photo-placeholder" style="min-height:160px">${ini}</div>`;

  const skillsH = d.habilidades.map(s=>`<div class="skill-item"><div class="skill-name">${s.nombre}</div><div class="skill-bar"><div class="skill-fill" style="width:${s.nivel}%"></div></div></div>`).join('');
  const jobsH = d.experiencia.map(j=>`<div class="job"><div class="job-title">${j.titulo}</div><div class="job-meta">${j.empresa} · <span style="color:#FFD000">${j.periodo}</span></div>${j.bullets.map(b=>`<div class="bullet">${b}</div>`).join('')}</div>`).join('');
  const eduH = d.educacion.map(e=>`<div><strong style="font-size:0.82rem">${e.titulo}</strong><br><span style="font-size:0.72rem;color:#888">${e.institucion} · ${e.año}</span></div>`).join('');
  const langH = d.idiomas.map(l=>`<div class="lang-item"><span class="lang-dot">${l.nombre}</span><span style="font-size:0.72rem;color:#888">${l.nivel}</span></div>`).join('');
  const logrosH = d.logros.map(l=>`<div class="bullet">• ${l}</div>`).join('');
  const contactsH = `<div class="contact-item">✉ ${d.email}</div>${d.telefono?`<div class="contact-item">📱 ${d.telefono}</div>`:''}${d.linkedin?`<div class="contact-item">🔗 ${d.linkedin}</div>`:''}`;

  const templates = {
    h1:`<div class="cv-h1"><div class="header"><div class="photo-wrap">${ph}</div><div><div class="name">${d.nombre}</div><div class="role">${d.puesto}</div><div class="contacts">${contactsH}</div></div></div><div class="body"><div class="sidebar"><div class="sec-s"><div class="sec-title">Perfil</div><p style="font-size:0.78rem;color:#555;line-height:1.6">${d.resumen}</p></div><div class="sec-s"><div class="sec-title">Habilidades</div>${skillsH}</div><div class="sec-s"><div class="sec-title">Idiomas</div>${langH}</div><div class="sec-s"><div class="sec-title">Educación</div>${eduH}</div></div><div class="main"><div class="sec-title">Experiencia profesional</div>${jobsH}${d.logros.length?`<div style="margin-top:20px"><div class="sec-title">Logros destacados</div>${logrosH}</div>`:''}</div></div></div>`,

function generarCV() {
  const cvHTML = buildCV(selectedTemplate);
  document.getElementById('cvOutput').innerHTML = cvHTML;
  document.getElementById('selectorUI').style.display = 'none';
  document.getElementById('cvContainer').style.display = 'block';
  window.scrollTo({top:0, behavior:'smooth'});
}

function volver() {
  document.getElementById('cvContainer').style.display = 'none';
  document.getElementById('selectorUI').style.display = 'block';
  window.scrollTo({top:0, behavior:'smooth'});
}

function descargarPDF() {
  const el = document.getElementById('cvOutput').firstElementChild;
  const nombre = (CV_DATA.nombre || 'CV').replace(/\s+/g, '_');
  const opt = {
    margin: 0,
    filename: `CV_${nombre}.pdf`,
    image: { type:'jpeg', quality:0.98 },
    html2canvas: { scale:2, useCORS:true },
    jsPDF: { unit:'mm', format:'a4', orientation:'portrait' }
  };
  html2pdf().set(opt).from(el).save();
}
