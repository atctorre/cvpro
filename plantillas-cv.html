<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Elige tu plantilla | CVPro</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=Montserrat:wght@300;400;500;600;700&family=Raleway:wght@300;400;500;600;700&family=Lato:wght@300;400;700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.2.7/pdfmake.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.2.7/vfs_fonts.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Montserrat',sans-serif;background:#111;color:#fff;min-height:100vh}
nav{position:sticky;top:0;z-index:200;display:flex;align-items:center;justify-content:space-between;padding:14px 5%;background:rgba(10,10,10,0.97);backdrop-filter:blur(12px);border-bottom:1px solid #222}
.nav-logo{font-family:'Montserrat',sans-serif;font-size:1.2rem;font-weight:800;color:#FFD000;text-decoration:none}
.nav-logo span{color:#fff}
.nav-back{color:#888;font-size:0.85rem;text-decoration:none;cursor:pointer}
.nav-back:hover{color:#FFD000}

/* ── LAYOUT ── */
.page{max-width:1100px;margin:0 auto;padding:40px 20px 80px}
.page-title{text-align:center;margin-bottom:40px}
.page-title h1{font-family:'Montserrat',sans-serif;font-size:2rem;font-weight:800;color:#FFD000;margin-bottom:8px}
.page-title p{color:#888;font-size:0.9rem}

/* ── GENDER TABS ── */
.gender-tabs{display:flex;gap:10px;justify-content:center;margin-bottom:32px}
.gender-tab{padding:11px 30px;border-radius:50px;font-size:0.88rem;font-weight:700;cursor:pointer;border:2px solid #333;background:transparent;color:#888;transition:all 0.3s;font-family:'Montserrat',sans-serif}
.gender-tab.active{background:#FFD000;color:#000;border-color:#FFD000}

/* ── PLANTILLAS GRID ── */
.templates-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:16px;margin-bottom:36px}
@media(max-width:700px){.templates-grid{grid-template-columns:repeat(2,1fr)}}
.tpl-card{background:#1a1a1a;border:2px solid #2a2a2a;border-radius:14px;overflow:hidden;cursor:pointer;transition:all 0.3s;position:relative}
.tpl-card:hover{border-color:#FFD000;transform:translateY(-4px)}
.tpl-card.selected{border-color:#FFD000;box-shadow:0 0 24px rgba(255,208,0,0.3)}
.tpl-selected-badge{display:none;position:absolute;top:8px;right:8px;background:#FFD000;color:#000;font-size:0.6rem;font-weight:800;padding:3px 8px;border-radius:50px;z-index:2}
.tpl-card.selected .tpl-selected-badge{display:block}

/* MINIATURAS */
.tpl-preview{height:160px;overflow:hidden;position:relative;pointer-events:none}
.tpl-preview .mini{transform:scale(0.22);transform-origin:top left;width:454%;height:454%;pointer-events:none}
.tpl-name{padding:10px 12px;font-size:0.75rem;font-weight:700;color:#ccc;text-align:center;border-top:1px solid #2a2a2a}
.tpl-card.selected .tpl-name{color:#FFD000}

/* ── FOTO UPLOAD ── */
.foto-section{background:#1a1a1a;border:1px solid #2a2a2a;border-radius:16px;padding:24px;margin-bottom:24px}
.foto-section h3{font-size:0.85rem;font-weight:700;color:#FFD000;margin-bottom:16px;letter-spacing:1px;text-transform:uppercase}
.foto-upload-area{border:2px dashed #333;border-radius:12px;padding:20px;text-align:center;cursor:pointer;transition:border-color 0.3s;margin-bottom:16px}
.foto-upload-area:hover{border-color:#FFD000}
.foto-upload-area input{display:none}
.foto-upload-area p{color:#888;font-size:0.82rem;margin-top:8px}

/* AJUSTE FOTO */
.foto-ajuste{display:none}
.foto-ajuste.visible{display:block}
.foto-ajuste h4{font-size:0.78rem;color:#aaa;margin-bottom:10px}
.foto-crop-wrap{position:relative;width:200px;height:200px;margin:0 auto 16px;border-radius:50%;overflow:hidden;border:3px solid #FFD000;background:#222;cursor:move;user-select:none}
.foto-crop-wrap.square{border-radius:12px}
.foto-crop-wrap img{position:absolute;cursor:move;transform-origin:center center}
.crop-controls{display:grid;grid-template-columns:1fr 1fr;gap:12px;max-width:300px;margin:0 auto}
.crop-ctrl{display:flex;flex-direction:column;gap:4px}
.crop-ctrl label{font-size:0.72rem;color:#888}
.crop-ctrl input[type=range]{width:100%;accent-color:#FFD000}
.btn-foto-ok{display:block;width:100%;background:#FFD000;color:#000;font-weight:700;font-size:0.85rem;padding:10px;border:none;border-radius:50px;cursor:pointer;margin-top:12px;font-family:'Montserrat',sans-serif}

/* ── BOTÓN GENERAR ── */
.btn-generar{width:100%;background:#FFD000;color:#000;font-family:'Montserrat',sans-serif;font-weight:800;font-size:1rem;padding:16px;border:none;border-radius:50px;cursor:pointer;transition:transform 0.2s,box-shadow 0.2s;box-shadow:0 0 30px rgba(255,208,0,0.2);margin-top:8px}
.btn-generar:hover{transform:translateY(-2px);box-shadow:0 0 50px rgba(255,208,0,0.4)}

/* ── CV OUTPUT ── */
.cv-result{display:none;max-width:900px;margin:0 auto;padding:20px}
.cv-actions{display:flex;gap:12px;margin-bottom:20px;flex-wrap:wrap}
.btn-pdf{background:#FFD000;color:#000;font-weight:700;padding:12px 28px;border:none;border-radius:50px;cursor:pointer;font-size:0.9rem;transition:transform 0.2s;font-family:'Montserrat',sans-serif}
.btn-pdf:hover{transform:scale(1.04)}
.btn-carta{background:#0d1b2a;color:#FFD000;font-weight:700;padding:12px 28px;border:none;border-radius:50px;cursor:pointer;font-size:0.9rem;font-family:'Montserrat',sans-serif;transition:transform 0.2s}
.btn-carta:hover{transform:scale(1.04)}
.btn-volver{background:transparent;color:#fff;font-weight:600;padding:12px 28px;border:2px solid #444;border-radius:50px;cursor:pointer;font-size:0.9rem;font-family:'Montserrat',sans-serif}
.btn-volver:hover{border-color:#FFD000;color:#FFD000}
#cvFinal{background:#fff}

/* ════════════════════
   PLANTILLAS CSS
════════════════════ */
/* H1 NAVY */
.cv-h1{font-family:'Montserrat',sans-serif;background:#fff;color:#1a1a1a;width:794px;overflow-wrap:break-word;word-break:break-word}
.cv-h1 .hdr{background:#0d1b2a;padding:36px 40px;display:flex;gap:24px;align-items:center}
.cv-h1 .ph{width:100px;height:100px;border-radius:50%;overflow:hidden;border:4px solid #FFD000;flex-shrink:0;background:#2a4a6b;display:flex;align-items:center;justify-content:center;font-size:2rem;color:#FFD000}
.cv-h1 .ph img{width:100%;height:100%;object-fit:cover;display:block}
.cv-h1 .nm{font-size:1.8rem;font-weight:700;color:#fff;line-height:1.1}

.cv-h1 .ct{display:flex;flex-wrap:wrap;gap:8px}
.cv-h1 .ci{font-size:0.72rem;color:#ccc}
.cv-h1 .bd{display:grid;grid-template-columns:210px minmax(0,1fr)}
.cv-h1 .sb{background:#f0f4f8;padding:24px 20px}
.cv-h1 .mn{padding:24px 26px}
.cv-h1 .st{font-size:0.6rem;font-weight:700;letter-spacing:3px;text-transform:uppercase;color:#0d1b2a;border-bottom:2px solid #FFD000;padding-bottom:4px;margin-bottom:12px}
.cv-h1 .sk{margin-bottom:8px}
.cv-h1 .sn{font-size:0.72rem;font-weight:600;color:#333;margin-bottom:2px}
.cv-h1 .sb2{height:4px;background:#ddd;border-radius:2px}
.cv-h1 .sf{height:100%;background:linear-gradient(90deg,#0d1b2a,#FFD000);border-radius:2px}
.cv-h1 .jb{margin-bottom:16px;padding-left:12px;border-left:3px solid #FFD000}
.cv-h1 .jt{font-size:0.86rem;font-weight:700;color:#0d1b2a}
.cv-h1 .jm{font-size:0.72rem;color:#666;margin:3px 0 7px}
.cv-h1 .bl{font-size:0.74rem;color:#444;line-height:1.6;margin-bottom:2px;padding-left:10px;position:relative}
.cv-h1 .bl::before{content:'▸';position:absolute;left:0;color:#0d1b2a;font-size:0.65rem}
.cv-h1 .li{display:flex;justify-content:space-between;font-size:0.74rem;margin-bottom:5px}

/* H2 NEGRO DORADO */
.cv-h2{font-family:'Raleway',sans-serif;background:#fff;color:#1a1a1a;width:794px}

/* H3 MINIMALISTA */
.cv-h3{font-family:'Lato',sans-serif;background:#fff;color:#1a1a1a;width:794px}

.cv-h3 .jb{margin-bottom:14px}

.cv-h3 .dr{display:flex;justify-content:space-between;align-items:center;margin-bottom:7px}
.cv-h3 .dn{font-size:0.72rem;font-weight:700}

.cv-h3 .dot{width:7px;height:7px;border-radius:50%;background:#eee}

.cv-h4 .sf{height:100%;background:#2d4a22;border-radius:2px}
.cv-h4 .jb{margin-bottom:14px;padding-bottom:14px;border-bottom:1px solid #eee}

<script>
// ══ RED DE SEGURIDAD: fetch() no lanza excepción con 400/500, así que un
// try/catch sin mirar res.ok esconde el fallo por completo. Este envoltorio
// registra en consola CUALQUIER respuesta no-OK de toda la aplicación.
// Es diagnóstico: no cambia el comportamiento de ninguna llamada.
(function() {
  const _f = window.fetch;
  window.fetch = async function(...args) {
    const r = await _f.apply(this, args);
    if (!r.ok) {
      const url = (typeof args[0] === 'string' ? args[0] : (args[0] && args[0].url) || '?');
      console.error(`🌐 fetch ${r.status} ${r.statusText} → ${String(url).substring(0, 120)}`);
    }
    return r;
  };
})();
</script>

function corregirFechaCarta(t) {
  const h = new Date();
  const mesesES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
  const mesesEN = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  const esEN = (typeof LANG !== 'undefined' && LANG === 'en');
  const fechaOK = esEN
    ? `${mesesEN[h.getMonth()]} ${h.getDate()}, ${h.getFullYear()}`
    : `${h.getDate()} de ${mesesES[h.getMonth()]} de ${h.getFullYear()}`;
  let out = String(t || '');
  // Reemplaza "mes de AAAA" o "mes AAAA" en español por la fecha real
  const reES = new RegExp('(?:\\d{1,2}\\s+de\\s+)?(' + mesesES.join('|') + ')\\s+(?:de\\s+)?(19|20)\\d{2}', 'gi');
  out = out.replace(reES, fechaOK);
  // Inglés: "Month DD, YYYY" o "Month YYYY"
  const reEN = new RegExp('(' + mesesEN.join('|') + ')\\s+\\d{0,2},?\\s*(19|20)\\d{2}', 'gi');
  out = out.replace(reEN, fechaOK);
  // Cualquier año suelto posterior al actual
  out = out.replace(/\b(19|20)\d{2}\b/g, (m) => Number(m) > h.getFullYear() ? String(h.getFullYear()) : m);
  return out;
}

function limpiarCarta(t) {
  const _r = String(t || '')
    .replace(/\r/g, '')
    .replace(/^\s*#{1,6}\s*.*$/gm, '')          // títulos markdown completos
    .replace(/^\s*[-–—_*]{3,}\s*$/gm, '')       // separadores --- ___ ***
    .replace(/\*\*/g, '')                        // negritas
    .replace(/(^|\s)\*(\S)/g, '$1$2')            // asteriscos sueltos
    .replace(/\*/g, '')
    .replace(/^\s*>\s?/gm, '')                   // citas
    .replace(/`/g, '')
    .replace(/\n{3,}/g, '\n\n')
    .split('\n').map(l => l.replace(/\s+$/,'')).join('\n')
    .trim();
  return corregirFechaCarta(_r);
}

function activarDragFoto() {
  const wrap = document.getElementById('cropWrap');
  if (!wrap || wrap.dataset.drag) return;
  // Nota: mostrarAjuste() recrea el #cropWrap cada vez, así que dataset.drag
  // siempre viene vacío y los listeners de window se acumulaban. Los limpiamos.
  if (window._dragFotoCleanup) window._dragFotoCleanup();
  wrap.dataset.drag = '1';
  wrap.style.cursor = 'grab';
  wrap.style.touchAction = 'none';
  let sx=0, sy=0, ox=0, oy=0, activo=false;
  const X = () => document.getElementById('xCtrl');
  const Y = () => document.getElementById('yCtrl');
  const Z = () => document.getElementById('zoomCtrl');
  const down = (e) => {
    activo = true; wrap.style.cursor = 'grabbing';
    const p = e.touches ? e.touches[0] : e;
    sx = p.clientX; sy = p.clientY;
    ox = parseInt(X()?.value||0); oy = parseInt(Y()?.value||0);
    e.preventDefault();
  };
  const move = (e) => {
    if (!activo) return;
    const p = e.touches ? e.touches[0] : e;
    if (X()) X().value = Math.max(-150, Math.min(150, ox + (p.clientX - sx)));
    if (Y()) Y().value = Math.max(-150, Math.min(150, oy + (p.clientY - sy)));
    actualizarFoto();
  };
  const up = () => { activo = false; wrap.style.cursor = 'grab'; };
  wrap.addEventListener('mousedown', down);
  window.addEventListener('mousemove', move);
  window.addEventListener('mouseup', up);
  wrap.addEventListener('touchstart', down, {passive:false});
  window.addEventListener('touchmove', move, {passive:false});
  window.addEventListener('touchend', up);
  window._dragFotoCleanup = () => {
    window.removeEventListener('mousemove', move);
    window.removeEventListener('mouseup', up);
    window.removeEventListener('touchmove', move);
    window.removeEventListener('touchend', up);
  };
  wrap.addEventListener('wheel', (e) => {
    e.preventDefault();
    if (Z()) { Z().value = Math.max(50, Math.min(250, parseInt(Z().value) + (e.deltaY < 0 ? 6 : -6))); actualizarFoto(); }
  }, {passive:false});
}

async function confirmarFoto() {
  const wrap = document.getElementById('cropWrap');
  const isCircle = !wrap.classList.contains('square');
  const size = 400;
  const canvas = document.createElement('canvas');
  canvas.width = size; canvas.height = size;
  const ctx = canvas.getContext('2d');

  const tmpImg = new Image();
  tmpImg.src = fotoOriginal;
  await new Promise(r => tmpImg.onload = r);

  const _z = parseFloat(document.getElementById('zoomCtrl').value);
  const _x = parseFloat(document.getElementById('xCtrl').value);
  const _y = parseFloat(document.getElementById('yCtrl').value);
  _ajustePrev = {z:_z, x:_x, y:_y};
  const zoom = _z / 100;
  const xOff = _x * 2;
  const yOff = _y * 2;

  // La vista previa escala SIEMPRE por ancho (`img.style.width = zoom + '%'`
  // sobre un recuadro de 200px). El canvas escalaba por ALTO cuando la foto
  // era apaisada, así que salía `ratio` veces más grande que lo que el usuario
  // había encuadrado. Ahora replicamos exactamente la vista previa.
  const ratio = tmpImg.naturalWidth / tmpImg.naturalHeight;
  const iw = size * zoom;
  const ih = iw / ratio;
  const ix = (size - iw) / 2 + xOff;
  const iy = (size - ih) / 2 + yOff;

  // Detectar color dominante de los bordes de la foto
  const sampleCanvas = document.createElement('canvas');
  const sw = tmpImg.naturalWidth, sh = tmpImg.naturalHeight;
  sampleCanvas.width = sw; sampleCanvas.height = sh;
  const sCtx = sampleCanvas.getContext('2d');
  sCtx.drawImage(tmpImg, 0, 0);

  // Muestrear píxeles de los 4 bordes
  let rSum=0, gSum=0, bSum=0, count=0;
  const step = Math.max(1, Math.floor(Math.min(sw,sh)/20));
  const borderPx = Math.floor(Math.min(sw,sh) * 0.08); // 8% del borde

  const sampleRegions = [
    {x:0, y:0, w:borderPx, h:sh},          // borde izquierdo
    {x:sw-borderPx, y:0, w:borderPx, h:sh}, // borde derecho
    {x:0, y:0, w:sw, h:borderPx},           // borde superior
    {x:0, y:sh-borderPx, w:sw, h:borderPx}  // borde inferior
  ];

  sampleRegions.forEach(r => {
    for (let x=r.x; x<r.x+r.w; x+=step) {
      for (let y=r.y; y<r.y+r.h; y+=step) {
        const px = sCtx.getImageData(Math.min(x,sw-1), Math.min(y,sh-1), 1, 1).data;
        rSum+=px[0]; gSum+=px[1]; bSum+=px[2]; count++;
      }
    }
  });

  const br = Math.round(rSum/count);
  const bg = Math.round(gSum/count);
  const bb = Math.round(bSum/count);

  // Rellenar canvas con color dominante del borde
  ctx.fillStyle = `rgb(${br},${bg},${bb})`;
  ctx.fillRect(0, 0, size, size);

  // Clip circular si aplica
  if (isCircle) {
    ctx.save();
    ctx.beginPath();
    ctx.arc(size/2, size/2, size/2, 0, Math.PI*2);
    ctx.clip();
  }

  ctx.drawImage(tmpImg, ix, iy, iw, ih);
  if (isCircle) ctx.restore();
  fotoAjustada = canvas.toDataURL('image/jpeg', 0.95);

  const ajuste = document.getElementById('fotoAjuste');
  ajuste.innerHTML = `
    <div style="text-align:center">
      <img src="${fotoAjustada}" style="width:90px;height:90px;border-radius:${isCircle?'50%':'10px'};border:3px solid #FFD000;object-fit:cover;margin-bottom:8px">
      <p style="color:#00C853;font-size:0.82rem;font-weight:700">✅ Foto ajustada correctamente</p>
      <div style="display:flex;gap:8px;justify-content:center;margin-top:8px">
        <button onclick="mostrarAjuste()" style="background:transparent;color:#FFD000;border:1px solid #FFD000;border-radius:20px;padding:5px 14px;font-size:0.75rem;cursor:pointer;font-family:'Montserrat',sans-serif">✏️ Reajustar</button>
        <button onclick="document.getElementById('fotoInput').click()" style="background:transparent;color:#888;border:1px solid #444;border-radius:20px;padding:5px 14px;font-size:0.75rem;cursor:pointer;font-family:'Montserrat',sans-serif">📷 Cambiar foto</button>
      </div>
    </div>`;
  renderTemplates();
}

let _cvOriginalIdioma = null;   // copia del CV antes de traducir

async function traducirCV() {
  ev('translate_clicked');
  if (!(await accesoVerificado('estandar'))) { abrirMuroPago('estandar', () => traducirCV()); return; }

  const btn = document.getElementById('btnTraducir');

    aplicarEtiquetasIdioma(hacia);

function mostrarToast(msg) {
  if (typeof toast === 'function') return toast(msg);
  const t = document.createElement('div');
  t.textContent = msg;
  t.style.cssText = 'position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#1baf7a;color:#fff;padding:12px 22px;border-radius:50px;font-family:Inter,system-ui,sans-serif;font-size:.85rem;font-weight:600;z-index:100001;box-shadow:0 6px 24px rgba(0,0,0,.25);opacity:0;transition:opacity .35s';
  document.body.appendChild(t);
  requestAnimationFrame(()=>{ t.style.opacity='1'; });
  setTimeout(()=>{ t.style.opacity='0'; setTimeout(()=>t.remove(), 400); }, 3600);
}

// ══ PDF ATS: TEXTO REAL SELECCIONABLE (pasa filtros ATS) ══

// ══════════ NORMALIZACIÓN TIPOGRÁFICA PARA PDF ══════════
// La fuente Roboto de pdfMake no tiene glifos para las ligaduras tipográficas
// (ﬁ ﬂ ﬀ...). Cuando el texto las contiene, pdfMake las OMITE: el ATS leía
// "Perfl" en vez de "Perfil" y "certifcación" en vez de "certificación".
// En pantalla se veía bien; el daño solo aparecía en la extracción.
function normalizarTipografia(s) {
  return String(s == null ? '' : s)
    .replace(/\uFB00/g, 'ff').replace(/\uFB01/g, 'fi').replace(/\uFB02/g, 'fl')
    .replace(/\uFB03/g, 'ffi').replace(/\uFB04/g, 'ffl').replace(/\uFB05/g, 'st')
    .replace(/\u00A0/g, ' ')                 // espacio duro
    .replace(/[\u2018\u2019]/g, "'")        // comillas curvas
    .replace(/[\u201C\u201D]/g, '"')
    .replace(/\u2026/g, '...')
    .replace(/[\u2013\u2014]/g, '-')        // guiones largos
    .replace(/\u2212/g, '-')
    .replace(/\*\*(.+?)\*\*/g, '$1')        // markdown residual
    .replace(/\*(.+?)\*/g, '$1')
    .replace(/[*_`]/g, '');
}

// Aplica la normalización a todo un objeto de CV, recursivamente
function normalizarCVData(d) {
  const rec = (v) => {
    if (typeof v === 'string') return normalizarTipografia(v);
    if (Array.isArray(v)) return v.map(rec);
    if (v && typeof v === 'object') {
      const o = {};
      for (const k in v) o[k] = rec(v[k]);
      return o;
    }
    return v;
  };
  return rec(d);
}

// pdfMake/Roboto sustituye "fi", "fl" y "ff" por un glifo de ligadura cuyo
// mapa ToUnicode apunta solo a "f" — verificado en el PDF generado: el glifo
// 00ed → 'f'. En pantalla se ve "certificación"; al extraer el texto sale
// "certifcación". Como el ATS lee la extracción, la palabra clave se pierde.
// Solución: partir el texto en fragmentos separados justo entre las dos
// letras. El shaper no forma ligaduras a través de fragmentos distintos y la
// extracción los concatena sin añadir ningún carácter invisible.
function sinLigaduras(s) {
  const t = normalizarTipografia(s);
  if (!/f[ifl]/i.test(t)) return t;
  const partes = [];
  let ini = 0;
  for (let i = 0; i < t.length - 1; i++) {
    if (/f/i.test(t[i]) && /[ifl]/i.test(t[i + 1])) {
      partes.push(t.slice(ini, i + 1));
      ini = i + 1;
    }
  }
  partes.push(t.slice(ini));
  return partes.filter(p => p !== '');
}

    jsPDF:{unit:'mm',format:'a4',orientation:'portrait',compress:true},

}

async function verificarPagoServidor() {
  const codigo = sessionStorage.getItem('cvpro_codigo') || '';
  if (!codigo) return null;
  try {
    const SB_U = 'https://lljmqyejwkgcbuwkgjkh.supabase.co';
    const SB_K = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imxsam1xeWVqd2tnY2J1d2tnamtoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcxNzc5MzEsImV4cCI6MjEwMjc1MzkzMX0.5zyP9cb9wnkjlPeafe8zBOBPU-joameF0UzxUXDgq60';
    const res = await fetch(`${SB_U}/rest/v1/rpc/verificar_pago`, {
      method: 'POST',
      headers: {'Content-Type':'application/json','apikey':SB_K,'Authorization':`Bearer ${SB_K}`},
      body: JSON.stringify({p_codigo: codigo})
    });
    const rows = await res.json();
    const r = Array.isArray(rows) ? rows[0] : rows;
    if (r && r.pagado) {
      localStorage.setItem('cvpro_pago', JSON.stringify({ok:true, plan:r.plan, verificado:true, ts:Date.now()}));
      return r.plan;
    }
    // El servidor dice que NO hay pago → limpiar cualquier localStorage falsificado
    const local = JSON.parse(localStorage.getItem('cvpro_pago') || 'null');
    if (local && local.ok && !(typeof esTester === 'function' && esTester())) {
      localStorage.removeItem('cvpro_pago');
      console.warn('Pago no verificado en servidor — acceso revocado');
    }
    return null;
  } catch(e) { console.warn('No se pudo verificar el pago:', e.message); return null; }
}


// ══════════ LÍMITES DE USO POR PLAN (verificados en servidor) ══════════
// Básico: 0 · Estándar: 1 de cada · Premium: ilimitado

// Comprueba el cupo SIN consumirlo. El cupo solo se descuenta cuando el
// entregable llega de verdad (ver consumirUso), nunca al abrir un modal ni
// antes de una llamada a la IA que puede fallar.
async function verificarCupo(tipo) {
  if (typeof esTester === 'function' && esTester()) return {permitido:true, plan:'premium', limite:-1, usados:0};
  const codigo = sessionStorage.getItem('cvpro_codigo') || '';
  if (!codigo) return {permitido:false, plan:'ninguno', limite:0, usados:0};
  try {
    const SB_U = 'https://lljmqyejwkgcbuwkgjkh.supabase.co';
    const SB_K = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imxsam1xeWVqd2tnY2J1d2tnamtoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcxNzc5MzEsImV4cCI6MjEwMjc1MzkzMX0.5zyP9cb9wnkjlPeafe8zBOBPU-joameF0UzxUXDgq60';
    const res = await fetch(`${SB_U}/rest/v1/rpc/consultar_usos`, {
      method:'POST',
      headers:{'Content-Type':'application/json','apikey':SB_K,'Authorization':`Bearer ${SB_K}`},
      body: JSON.stringify({p_codigo: codigo, p_tipo: tipo})
    });
    if (!res.ok) return {permitido:false, plan:'error', limite:0, usados:0};
    const rows = await res.json();
    const r = (Array.isArray(rows) ? rows[0] : rows) || {};
    const limite = Number.isFinite(+r.limite) ? +r.limite : 0;
    const usados = Number.isFinite(+r.usados) ? +r.usados : 0;
    return {permitido: limite === -1 || (limite > 0 && usados < limite), plan: r.plan || 'ninguno', limite, usados};
  } catch(e) {
    console.warn('No se pudo consultar el cupo:', e.message);
    return {permitido:false, plan:'error', limite:0, usados:0};
  }
}

async function asegurarCodigoCV() {
  let cod = sessionStorage.getItem('cvpro_codigo');
  if (cod && cod.length >= 6) return cod;
  // No hay código: generar uno y guardar el CV ahora mismo
  const buf = new Uint32Array(2);
  (window.crypto || window.msCrypto).getRandomValues(buf);
  const ALF = '23456789ABCDEFGHJKLMNPQRSTUVWXYZ';
  cod = Array.from({length:8}, (_,i) => ALF[(buf[i%2] >>> (i*4)) % ALF.length]).join('');
  try {
    const SB_U = 'https://lljmqyejwkgcbuwkgjkh.supabase.co';
    const SB_K = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imxsam1xeWVqd2tnY2J1d2tnamtoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcxNzc5MzEsImV4cCI6MjEwMjc1MzkzMX0.5zyP9cb9wnkjlPeafe8zBOBPU-joameF0UzxUXDgq60';
    const _r = await fetch(`${SB_U}/rest/v1/cvs_guardados`, {
      method:'POST',
      headers:{'Content-Type':'application/json','apikey':SB_K,'Authorization':`Bearer ${SB_K}`,'Prefer':'return=minimal'},
      body: JSON.stringify({
        codigo: cod, nombre: D.nombre || '', email: D.email || '',
        cv_texto: sessionStorage.getItem('cvTexto') || '',
        cv_data: D, lang: LANG,
        expira_en: new Date(Date.now() + 90*86400000).toISOString()
      })
    });
    if (!_r.ok) console.error('⚠️ CV no guardado antes del pago:', _r.status, await _r.text());
  } catch(e) { console.warn('No se pudo guardar el CV antes del pago:', e.message); }
  sessionStorage.setItem('cvpro_codigo', cod);
  return cod;
}

  ev('checkout_started', {plan: planSugerido || planActual()});
  const L = (typeof LANG !== 'undefined' && LANG === 'en') ? 'en' : 'es';
  let planSel = planSugerido || planActual();

  const ov = document.createElement('div');
  ov.id = 'muroPago';
  ov.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:100000;display:flex;align-items:center;justify-content:center;padding:16px;overflow-y:auto';
  ov.innerHTML = `
    <div style="background:#fff;border-radius:20px;max-width:440px;width:100%;padding:28px;font-family:Inter,system-ui,sans-serif;max-height:94vh;overflow-y:auto">
      <div style="text-align:right;margin-top:-10px"><button onclick="document.getElementById('muroPago').remove()" style="background:none;border:none;font-size:1.3rem;cursor:pointer;color:#999">✕</button></div>
      <h2 style="font-size:1.25rem;color:#111;margin-bottom:4px">${L==='en'?'Your resume is ready 🎉':'Tu CV está listo 🎉'}</h2>
      <p style="color:#666;font-size:.87rem;line-height:1.55;margin-bottom:18px">${L==='en'?'One-time payment. No subscriptions, no recurring charges. Download instantly.':'Pago único. Sin suscripciones ni cobros recurrentes. Descarga al instante.'}</p>
      <div id="planesMuro" style="display:flex;flex-direction:column;gap:9px;margin-bottom:16px"></div>
      <div id="paypalBtns" style="min-height:52px"></div>
      <p style="text-align:center;font-size:.72rem;color:#999;margin-top:14px">🔒 ${L==='en'?'Secure payment via PayPal · Card accepted':'Pago seguro con PayPal · Aceptamos tarjeta'}</p>
      <p style="text-align:center;font-size:.72rem;color:#7dd3a8;margin-top:6px">🛡️ ${L==='en'?'7-day money-back guarantee':'Garantía de 7 días — te devolvemos tu dinero'}</p>
    </div>`;
  document.body.appendChild(ov);

  function pintarPlanes() {
    const cont = document.getElementById('planesMuro');
    const desc = {
      basico:   {es:'CV con IA · 20 plantillas · PDF + versión ATS', en:'AI resume · 20 templates · PDF + ATS version'},
      estandar: {es:'+ 1 carta · 1 adaptación a vacante · 1 traducción', en:'+ 1 cover letter · 1 job adaptation · 1 translation'},
      premium:  {es:'+ Cartas, adaptaciones y traducciones ILIMITADAS · 6 meses', en:'+ UNLIMITED letters, adaptations & translations · 6 months'}
    };
    cont.innerHTML = Object.entries(PLANES).map(([k,v]) => `
      <label style="display:flex;align-items:center;gap:11px;border:2px solid ${k===planSel?'#FFD000':'#e5e5e5'};background:${k===planSel?'#fffbe6':'#fff'};border-radius:12px;padding:11px 13px;cursor:pointer">
        <input type="radio" name="planPago" value="${k}" ${k===planSel?'checked':''} style="accent-color:#FFD000">
        <span style="flex:1">
          <b style="font-size:.9rem;color:#111">${v.nombre[L]}</b>
          <span style="display:block;font-size:.73rem;color:#777;line-height:1.4">${desc[k][L]}</span>
        </span>
        <b style="font-size:1.05rem;color:#111">$${v.precio}</b>
      </label>`).join('');
    cont.querySelectorAll('input[name=planPago]').forEach(r => {
      r.onchange = () => { planSel = r.value; localStorage.setItem('cvpro_plan', planSel); pintarPlanes(); renderBotones(); };
    });
  }

  async function renderBotones() {
    const cont = document.getElementById('paypalBtns');
    cont.innerHTML = '';
    try {
      await cargarSDKPayPal();
      window.paypal.Buttons({
        style: {layout:'vertical', color:'gold', shape:'pill', label:'pay', height:46},
        createOrder: (data, actions) => actions.order.create({
          purchase_units: [{
            description: `CVPro ${PLANES[planSel].nombre[L]}`,
            amount: {value: PLANES[planSel].precio, currency_code: 'USD'}
          }]
        }),
        onApprove: async (data, actions) => {
          const det = await actions.order.capture();
          const payer = (det && det.payer) || {};
          // Monto REAL cobrado por PayPal (no el del frontend)
          let montoReal = PLANES[planSel].precio;
          try {
            const pu = det.purchase_units && det.purchase_units[0];
            const cap = pu && pu.payments && pu.payments.captures && pu.payments.captures[0];
            if (cap && cap.amount && cap.amount.value) montoReal = cap.amount.value;
          } catch(e) {}
          // El plan se deriva del monto real, no de lo que diga el frontend
          const planReal = parseFloat(montoReal) >= 14.99 ? 'premium'
                         : parseFloat(montoReal) >= 9.99 ? 'estandar'
                         : parseFloat(montoReal) >= 4.99 ? 'basico' : 'ninguno';
          localStorage.setItem('cvpro_pago', JSON.stringify({ok:true, plan:planReal, orden:det.id, ts:Date.now()}));
          await registrarPago(det.id, planReal, montoReal, {
            email: payer.email_address || '',
            nombre: ((payer.name||{}).given_name||'') + ' ' + ((payer.name||{}).surname||'')
          });
          ev('payment_success', {plan: planReal, monto: montoReal});
          document.getElementById('muroPago')?.remove();
          mostrarConfirmacionPago(planReal, det.id, montoReal);
          if (typeof alPagar === 'function') setTimeout(() => alPagar(planReal), 400);
        },
        onCancel: () => {
          ev('payment_cancelled');
          const cont2 = document.getElementById('paypalBtns');
          if (cont2) {
            const aviso = document.createElement('p');
            aviso.style.cssText = 'text-align:center;font-size:.8rem;color:#888;margin-top:10px';
            aviso.textContent = L==='en' ? 'Payment cancelled — your resume is safe, you can try again anytime.' : 'Pago cancelado — tu CV está guardado, puedes intentarlo cuando quieras.';
            cont2.parentElement.appendChild(aviso);
          }
        },
        onError: (err) => {
          console.error('PayPal error:', err);
          cont.innerHTML = `<p style="color:#c00;font-size:.82rem;text-align:center;line-height:1.5">${L==='en'?'Payment error. If you were charged, email hola@getcvpro.com with your order number and we will fix it immediately.':'Error en el pago. Si te cobraron, escríbenos a hola@getcvpro.com con tu número de orden y lo resolvemos de inmediato.'}</p>`;
        }
      }).render('#paypalBtns');
    } catch(e) {
      cont.innerHTML = `<p style="color:#c00;font-size:.82rem;text-align:center">${L==='en'?'Could not load PayPal. Check your connection.':'No se pudo cargar PayPal. Revisa tu conexión.'}</p>`;
    }
  }

  await asegurarCodigoCV();
  pintarPlanes();
  renderBotones();
}
